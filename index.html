<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>俄罗斯方块</title>
    <style>
        :root {
            --bg-1: #fff3e9;
            --bg-2: #ffe2cf;
            --panel: #ffffff;
            --panel-line: #ffb38a;
            --text: #5b4636;
            --muted: #a98c7a;
            --accent: #ff7a59;
            --accent-d: #e85d3c;
            --shadow: rgba(255, 122, 89, 0.28);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
            color: var(--text);
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: safe center;
            justify-content: center;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        /* 卡通装饰气泡 */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            filter: blur(6px);
        }
        body::before {
            width: 340px; height: 340px;
            top: -110px; left: -90px;
            background: radial-gradient(circle at 35% 35%, rgba(255, 154, 118, 0.45), rgba(255, 200, 150, 0.05) 70%);
        }
        body::after {
            width: 300px; height: 300px;
            bottom: -120px; right: -80px;
            background: radial-gradient(circle at 60% 40%, rgba(120, 200, 220, 0.4), rgba(150, 220, 230, 0.04) 70%);
        }
        /* 统一布局：分数栏跨顶、棋盘在左、NEXT/HOLD 在右、控制按钮跨底 */
        #app {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: auto auto;
            grid-template-areas:
                "score score"
                "board side"
                "ctrl  ctrl";
            gap: 16px;
            padding: 20px;
            justify-content: center;
            align-content: start;
        }
        #score-bar { grid-area: score; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        #board-panel { grid-area: board; position: relative; }
        #side-panel { grid-area: side; }
        #controls { grid-area: ctrl; }

        /* 卡通卡片面板 */
        .panel {
            background: var(--panel);
            border: 3px solid var(--panel-line);
            border-radius: 22px;
            padding: 16px;
            box-shadow: 0 8px 0 rgba(255, 140, 100, 0.18), 0 14px 28px var(--shadow);
        }
        #board-panel { padding: 10px; display: flex; align-items: center; justify-content: center; }
        #tetris-canvas {
            height: min(500px, calc(100vh - 280px));
            width: auto;
            border-radius: 12px;
        }
        #side-panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 160px;
        }

        /* 分数卡 */
        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: #fff;
            border: 3px solid var(--panel-line);
            border-radius: 18px;
            padding: 8px 16px;
            min-width: 92px;
            box-shadow: 0 5px 0 rgba(255, 140, 100, 0.18);
        }
        .stat .label {
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--muted);
            font-weight: 700;
        }
        .stat .value {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 28px;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 2px;
        }
        #next-panel, #hold-panel { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        #next-panel .label, #hold-panel .label {
            font-size: 13px;
            letter-spacing: 3px;
            color: var(--muted);
            font-weight: 800;
        }
        canvas { display: block; border-radius: 10px; }

        /* ===== 顶栏：左上角齿轮 + 居中标题 ===== */
        #topbar {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 760px;
            padding: 0 4px;
            margin: 0 auto;
        }
        .gear {
            flex: 0 0 auto;
            width: 50px; height: 50px;
            border-radius: 50%;
            border: 3px solid var(--panel-line);
            background: #fff;
            color: var(--accent);
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(255, 140, 100, 0.2);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.15s, filter 0.15s;
        }
        .gear:hover { filter: brightness(1.05); transform: rotate(35deg); }
        .gear:active { transform: scale(0.92) rotate(35deg); }
        .topbar-spacer { flex: 0 0 50px; }
        #wordmark {
            flex: 1;
            text-align: center;
            font-weight: 900;
            font-size: 30px;
            letter-spacing: 6px;
            color: var(--accent);
            text-shadow: 0 3px 0 rgba(255, 140, 100, 0.25);
        }

        /* ===== 通用卡通按钮 ===== */
        .btn {
            background: linear-gradient(180deg, #ff9a76, var(--accent));
            color: #fff;
            border: 3px solid var(--accent-d);
            border-radius: 16px;
            padding: 10px 14px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--accent-d);
            transition: transform 0.06s, box-shadow 0.06s, filter 0.15s;
        }
        .btn:hover { filter: brightness(1.05); }
        .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-d); }
        .btn.off { opacity: 0.55; filter: grayscale(0.5); }

        /* ===== 棋盘居中遮罩（开始/暂停） ===== */
        #board-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            background: rgba(255, 244, 235, 0.62);
            backdrop-filter: blur(2px);
            border-radius: 12px;
            z-index: 5;
        }
        #board-overlay.hidden { display: none; }
        #overlay-title {
            font-size: 26px;
            font-weight: 900;
            color: var(--accent);
            text-shadow: 0 2px 0 rgba(255, 140, 100, 0.25);
            letter-spacing: 3px;
        }
        #overlay-btn {
            background: linear-gradient(180deg, #ffb347, #ff8c3a);
            color: #fff;
            border: 4px solid #ef6e2c;
            border-radius: 50px;
            padding: 16px 46px;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            cursor: pointer;
            box-shadow: 0 7px 0 #ef6e2c, 0 12px 22px rgba(255, 140, 100, 0.4);
            transition: transform 0.08s, box-shadow 0.08s;
        }
        #overlay-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #ef6e2c; }
        #overlay-hint {
            font-size: 13px;
            color: var(--muted);
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* ===== 底部方向键 D-pad（2 行，对应键盘方向键） ===== */
        #controls {
            display: flex;
            justify-content: center;
            padding-top: 6px;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(4, 62px);
            grid-template-rows: repeat(2, 62px);
            gap: 10px;
        }
        .dpad-rotate { grid-column: 2 / span 2; grid-row: 1; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-down { grid-column: 2; grid-row: 2; }
        .dpad-drop { grid-column: 3; grid-row: 2; }
        .dpad-right { grid-column: 4; grid-row: 2; }
        .dpad button {
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 3px solid var(--accent-d);
            background: linear-gradient(180deg, #ff9a76, var(--accent));
            color: #fff;
            font-size: 26px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--accent-d);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.06s, box-shadow 0.06s;
            touch-action: none;
            user-select: none;
        }
        .dpad button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-d); }

        /* ===== 设置弹窗（齿轮菜单） ===== */
        #settings-popup {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            background: rgba(90, 60, 50, 0.32);
            padding: 14px;
        }
        #settings-popup.hidden { display: none; }
        .settings-card {
            width: 200px;
            background: #fff;
            border: 3px solid var(--panel-line);
            border-radius: 20px;
            padding: 14px;
            box-shadow: 0 10px 30px rgba(255, 122, 89, 0.4);
            display: flex;
            flex-direction: column;
            gap: 10px;
            animation: pop 0.16s ease;
        }
        @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .settings-title {
            text-align: center;
            font-weight: 900;
            font-size: 18px;
            color: var(--accent);
            letter-spacing: 3px;
            margin-bottom: 2px;
        }
        .settings-card .btn { width: 100%; box-shadow: 0 4px 0 var(--accent-d); font-size: 14px; }

        /* ===== 弹窗（结算 / 排行榜） ===== */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(90, 60, 50, 0.4);
            backdrop-filter: blur(2px);
            padding: 16px;
        }
        .modal.hidden { display: none; }
        .modal-card {
            width: 100%;
            max-width: 360px;
            background: #fff;
            border: 3px solid var(--panel-line);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 12px 34px rgba(255, 122, 89, 0.45);
            text-align: center;
        }
        .modal-card h2 {
            font-size: 24px;
            letter-spacing: 4px;
            color: var(--accent);
            text-shadow: 0 2px 0 rgba(255, 140, 100, 0.25);
            margin-bottom: 14px;
            font-weight: 900;
        }
        .modal-card .row {
            display: flex;
            justify-content: space-between;
            padding: 6px 4px;
            font-size: 15px;
            color: var(--text);
            border-bottom: 2px dashed rgba(255, 179, 138, 0.4);
        }
        .modal-card .row b {
            color: var(--accent);
            font-family: 'Consolas', monospace;
            letter-spacing: 2px;
        }
        .modal-card input {
            width: 100%;
            margin: 12px 0;
            padding: 11px;
            text-align: center;
            font-size: 16px;
            letter-spacing: 2px;
            background: #fff7f2;
            border: 3px solid var(--panel-line);
            border-radius: 14px;
            color: var(--text);
            outline: none;
            font-weight: 700;
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
        .modal-actions .btn { flex: 1; }
        #lb-list { list-style: none; max-height: 320px; overflow-y: auto; margin: 6px 0 14px; text-align: left; }
        #lb-list li {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 6px;
            font-size: 14px;
            color: var(--text);
            border-bottom: 2px dashed rgba(255, 179, 138, 0.35);
        }
        #lb-list li .rank { width: 26px; text-align: center; font-weight: 900; color: var(--accent); font-family: 'Consolas', monospace; }
        #lb-list li .nm { flex: 1; color: var(--text); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #lb-list li .sc { font-family: 'Consolas', monospace; color: var(--accent); letter-spacing: 1px; font-weight: 800; }
        #lb-list li .dt { font-size: 10px; color: var(--muted); }
        #lb-empty { color: var(--muted); font-size: 14px; padding: 18px 0; font-weight: 700; }

        /* ===== 手机端适配 ===== */
        @media (max-width: 720px) {
            body { align-items: flex-start; justify-content: flex-start; }
            #app {
                gap: 6px;
                padding: 6px;
                width: 100%;
                max-width: 480px;
                grid-template-areas:
                    "score score"
                    "board side"
                    "ctrl  side";
            }
            #board-panel { padding: 4px; }
            #controls { padding-top: 0; }
            #side-panel { align-self: start; }
            /* 棋盘尽可能大：宽度受限取宽度推导，否则吃满剩余高度（目标 ≥70% 视口） */
            #tetris-canvas {
                height: min(calc((100vw - 94px) * 2), calc(100vh - 220px));
                width: auto;
                max-width: calc(100vw - 94px);
            }
            @supports (height: 100dvh) {
                #tetris-canvas { height: min(calc((100vw - 94px) * 2), calc(100dvh - 220px)); }
            }
            #wordmark { font-size: 20px; letter-spacing: 3px; }
            .gear, .topbar-spacer { width: 38px; height: 38px; }
            #score-bar { gap: 5px; }
            .stat { min-width: 0; flex: 1 1 22%; padding: 4px 6px; border-radius: 12px; }
            .stat .label { font-size: 10px; letter-spacing: 1px; }
            .stat .value { font-size: 16px; }
            #side-panel { width: auto; gap: 6px; }
            #next-panel, #hold-panel { padding: 3px 5px; gap: 4px; }
            #next-canvas { width: 36px; height: 76px; }
            #hold-canvas { width: 36px; height: 32px; }
            #next-panel .label, #hold-panel .label { font-size: 10px; letter-spacing: 1px; }
            .dpad { grid-template-columns: repeat(4, 50px); grid-template-rows: repeat(2, 50px); gap: 8px; }
            .dpad button { font-size: 20px; }
        }
        @media (max-width: 720px) and (max-height: 760px) {
            #tetris-canvas { height: min(calc((100vw - 94px) * 2), calc(100vh - 235px)); }
            @supports (height: 100dvh) {
                #tetris-canvas { height: min(calc((100vw - 94px) * 2), calc(100dvh - 235px)); }
            }
            .dpad { grid-template-columns: repeat(4, 46px); grid-template-rows: repeat(2, 46px); gap: 6px; }
        }
    </style>
</head>
<body>
    <div id="shell">
        <header id="topbar">
            <button id="gear-btn" class="gear" aria-label="设置">⚙</button>
            <div id="wordmark">俄罗斯方块</div>
            <div class="topbar-spacer"></div>
        </header>
        <div id="app">
            <!-- 分数栏：游戏栏上方 -->
            <div id="score-bar">
                <div class="stat"><span class="label">SCORE</span><span class="value" id="score">00000</span></div>
                <div class="stat"><span class="label">BEST</span><span class="value" id="best">00000</span></div>
                <div class="stat"><span class="label">LINES</span><span class="value" id="lines">0</span></div>
                <div class="stat"><span class="label">LEVEL</span><span class="value" id="level">1</span></div>
            </div>
            <!-- 棋盘 + 居中遮罩（开始/暂停） -->
            <div class="panel" id="board-panel">
                <canvas id="tetris-canvas"></canvas>
                <div id="board-overlay">
                    <div id="overlay-title">俄罗斯方块</div>
                    <button id="overlay-btn">▶ 开始</button>
                    <div id="overlay-hint">点击画面或按钮开始</div>
                </div>
            </div>
            <!-- NEXT / HOLD -->
            <div id="side-panel">
                <div class="panel" id="next-panel">
                    <span class="label">NEXT</span>
                    <canvas id="next-canvas" width="140" height="300"></canvas>
                </div>
                <div class="panel" id="hold-panel">
                    <span class="label">HOLD</span>
                    <canvas id="hold-canvas" width="140" height="120"></canvas>
                </div>
            </div>
            <!-- 方向键 D-pad（2 行：上行旋转，下行 左/软降/直落/右） -->
            <div id="controls">
                <div class="dpad">
                    <button class="dpad-rotate" data-act="rotate" aria-label="旋转">↑</button>
                    <button class="dpad-left" data-act="left" aria-label="左移">←</button>
                    <button class="dpad-down" data-act="down" aria-label="加速下落">↓</button>
                    <button class="dpad-drop" data-act="drop" aria-label="一键下落">⇓</button>
                    <button class="dpad-right" data-act="right" aria-label="右移">→</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 设置弹窗（齿轮菜单） -->
    <div id="settings-popup" class="hidden">
        <div class="settings-card">
            <div class="settings-title">设置</div>
            <button class="btn" data-act="hold">暂存 (C)</button>
            <button class="btn" data-act="restart">重开 (R)</button>
            <button class="btn" data-act="theme">主题</button>
            <button class="btn" data-act="sound">音效 ♪</button>
            <button class="btn" data-act="leaderboard">排行榜</button>
            <button class="btn" data-act="close">关闭</button>
        </div>
    </div>

    <!-- 排行榜弹窗 -->
    <div id="leaderboard-modal" class="modal hidden">
        <div class="modal-card">
            <h2>排行榜 · TOP 10</h2>
            <ul id="lb-list"></ul>
            <div id="lb-empty" class="hidden">还没有记录，快去刷新纪录吧！</div>
            <div class="modal-actions">
                <button class="btn" id="lb-close-btn">关闭</button>
            </div>
        </div>
    </div>

    <!-- 结算弹窗 -->
    <div id="gameover-modal" class="modal hidden">
        <div class="modal-card">
            <h2>游戏结束</h2>
            <div class="row"><span>得分</span><b id="go-score">0</b></div>
            <div class="row"><span>消行</span><b id="go-lines">0</b></div>
            <div class="row"><span>等级</span><b id="go-level">1</b></div>
            <div id="go-newrecord" class="hidden" style="color:var(--accent);font-size:13px;margin-top:10px;font-weight:800;">🏆 新纪录！留下你的大名</div>
            <input id="go-name" maxlength="10" placeholder="输入名字" value="玩家">
            <div class="modal-actions">
                <button class="btn" id="go-save-btn">保存成绩</button>
                <button class="btn" id="go-restart-btn">再来一局</button>
            </div>
        </div>
    </div>

    <script>
        'use strict';

        // ===== 常量 =====
        const COLS = 10;
        const ROWS = 20;
        const EMPTY = null;

        const GameState = {
            READY: 'ready',
            PLAYING: 'playing',
            PAUSED: 'paused',
            GAME_OVER: 'gameOver'
        };

        // 卡通糖果配色（固定，主题仅切换背景/强调色）
        const PIECE_COLORS = {
            I: '#3fc7d4', O: '#ffce4a', T: '#b06fd6', S: '#6fc56f',
            Z: '#ff7a59', J: '#5b9bf6', L: '#ffab40'
        };

        const PIECES = {
            I: { color: PIECE_COLORS.I, matrix: [[1,1,1,1]] },
            O: { color: PIECE_COLORS.O, matrix: [[1,1],[1,1]] },
            T: { color: PIECE_COLORS.T, matrix: [[0,1,0],[1,1,1]] },
            S: { color: PIECE_COLORS.S, matrix: [[0,1,1],[1,1,0]] },
            Z: { color: PIECE_COLORS.Z, matrix: [[1,1,0],[0,1,1]] },
            J: { color: PIECE_COLORS.J, matrix: [[1,0,0],[1,1,1]] },
            L: { color: PIECE_COLORS.L, matrix: [[0,0,1],[1,1,1]] }
        };

        function createPiece(type) {
            const piece = PIECES[type];
            return {
                type,
                color: piece.color,
                matrix: piece.matrix.map(row => row.slice()),
                x: Math.floor(COLS / 2) - Math.floor(piece.matrix[0].length / 2),
                y: 0
            };
        }

        function rotateMatrix(matrix) {
            const N = matrix.length;
            const M = matrix[0].length;
            const rotated = Array.from({ length: M }, () => Array(N).fill(0));
            for (let y = 0; y < N; y++) {
                for (let x = 0; x < M; x++) {
                    rotated[x][N - 1 - y] = matrix[y][x];
                }
            }
            return rotated;
        }

        function rotatePiece(piece, direction) {
            let matrix = piece.matrix.map(row => row.slice());
            const times = direction === 'clockwise' ? 1 : 3;
            for (let i = 0; i < times; i++) {
                matrix = rotateMatrix(matrix);
            }
            return { ...piece, matrix };
        }

        function createBoard() {
            return Array.from({ length: ROWS }, () => Array(COLS).fill(EMPTY));
        }

        function isCellFilled(board, row, col) {
            return board[row] && board[row][col] !== EMPTY;
        }

        function isOutOfBounds(row, col) {
            return row < 0 || row >= ROWS || col < 0 || col >= COLS;
        }

        function collides(piece, board) {
            for (let y = 0; y < piece.matrix.length; y++) {
                for (let x = 0; x < piece.matrix[y].length; x++) {
                    if (piece.matrix[y][x]) {
                        const boardX = piece.x + x;
                        const boardY = piece.y + y;
                        if (isOutOfBounds(boardY, boardX) || (boardY >= 0 && isCellFilled(board, boardY, boardX))) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function clearLines(board) {
            let linesCleared = 0;
            for (let y = ROWS - 1; y >= 0; y--) {
                if (board[y].every(cell => cell !== EMPTY)) {
                    board.splice(y, 1);
                    board.unshift(Array(COLS).fill(EMPTY));
                    linesCleared++;
                    y++;
                }
            }
            return linesCleared;
        }

        // ===== 游戏状态机 =====
        function createGame(hooks) {
            const h = hooks || {};
            return {
                state: GameState.READY,
                board: createBoard(),
                piece: null,
                nextPiece: null,
                nextQueue: [],
                score: 0,
                lines: 0,
                level: 1,
                dropInterval: 1000,
                lastDrop: 0,
                bag: [],
                holdType: null,
                holdUsed: false,
                combo: 0,

                start() {
                    this.state = GameState.PLAYING;
                    this.board = createBoard();
                    this.score = 0;
                    this.lines = 0;
                    this.level = 1;
                    this.dropInterval = 1000;
                    this.lastDrop = 0;
                    this.bag = [];
                    this.holdType = null;
                    this.holdUsed = false;
                    this.combo = 0;
                    this.nextQueue = [];
                    this.ensureQueue();
                    this.nextPiece = this.nextQueue[0];
                    this.spawnPiece();
                    if (h.onStart) h.onStart();
                },

                ensureQueue() {
                    while (this.nextQueue.length < 4) this.nextQueue.push(this.getNextPiece());
                },

                spawnPiece() {
                    this.piece = this.nextQueue.shift();
                    this.ensureQueue();
                    this.nextPiece = this.nextQueue[0];
                    this.holdUsed = false;
                    if (collides(this.piece, this.board)) {
                        this.state = GameState.GAME_OVER;
                        if (h.onGameOver) h.onGameOver();
                    }
                },

                hold() {
                    if (this.state !== GameState.PLAYING || this.holdUsed) return false;
                    const currentType = this.piece.type;
                    if (this.holdType) {
                        const swapType = this.holdType;
                        this.holdType = currentType;
                        this.piece = createPiece(swapType);
                    } else {
                        this.holdType = currentType;
                        this.piece = this.nextQueue.shift();
                        this.ensureQueue();
                        this.nextPiece = this.nextQueue[0];
                    }
                    this.holdUsed = true;
                    if (h.onHold) h.onHold();
                    return true;
                },

                getNextPiece() {
                    if (this.bag.length === 0) {
                        this.bag = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
                        for (let i = this.bag.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [this.bag[i], this.bag[j]] = [this.bag[j], this.bag[i]];
                        }
                    }
                    return createPiece(this.bag.pop());
                },

                move(dx, dy) {
                    if (this.state !== GameState.PLAYING) return false;
                    const moved = { ...this.piece, x: this.piece.x + dx, y: this.piece.y + dy };
                    if (!collides(moved, this.board)) {
                        this.piece = moved;
                        if (h.onMove) h.onMove();
                        return true;
                    }
                    return false;
                },

                rotate(direction) {
                    if (this.state !== GameState.PLAYING) return false;
                    const rotated = rotatePiece(this.piece, direction);
                    const offsets = [0, -1, 1];
                    for (const off of offsets) {
                        const candidate = { ...rotated, x: rotated.x + off };
                        if (!collides(candidate, this.board)) {
                            this.piece = candidate;
                            if (h.onRotate) h.onRotate();
                            return true;
                        }
                    }
                    return false;
                },

                hardDrop() {
                    if (this.state !== GameState.PLAYING) return 0;
                    let distance = 0;
                    while (this.move(0, 1)) distance++;
                    this.lockPiece();
                    return distance;
                },

                lockPiece() {
                    this.piece.matrix.forEach((row, y) => {
                        row.forEach((value, x) => {
                            if (value) {
                                const by = this.piece.y + y;
                                const bx = this.piece.x + x;
                                if (by >= 0 && by < ROWS && bx >= 0 && bx < COLS) {
                                    this.board[by][bx] = {
                                        type: this.piece.type,
                                        color: this.piece.color
                                    };
                                }
                            }
                        });
                    });
                    const rows = [];
                    this.board.forEach((row, y) => {
                        if (row.every(c => c !== EMPTY)) rows.push(y);
                    });
                    const linesCleared = clearLines(this.board);
                    this.lines += linesCleared;
                    if (linesCleared > 0) {
                        this.combo++;
                        this.score += (this.combo - 1) * 50 * this.level;
                    } else {
                        this.combo = 0;
                    }
                    this.score += this.calculateScore(linesCleared);
                    this.updateDifficulty();
                    if (linesCleared > 0 && h.onClear) h.onClear(linesCleared, rows, this.combo);
                    this.spawnPiece();
                },

                calculateScore(linesCleared) {
                    const points = [0, 100, 300, 500, 800];
                    return points[linesCleared] * this.level;
                },

                updateDifficulty() {
                    const prevLevel = this.level;
                    this.level = Math.floor(this.lines / 10) + 1;
                    this.dropInterval = Math.max(100, 1000 - (this.level - 1) * 100);
                    if (this.level !== prevLevel && h.onLevelUp) h.onLevelUp(this.level);
                },

                tick(timestamp) {
                    if (this.state !== GameState.PLAYING) return;
                    if (!this.lastDrop) this.lastDrop = timestamp;
                    const elapsed = timestamp - this.lastDrop;
                    if (elapsed > this.dropInterval) {
                        if (!this.move(0, 1)) {
                            this.lockPiece();
                        }
                        this.lastDrop = timestamp;
                    }
                },

                pause() {
                    if (this.state === GameState.PLAYING) {
                        this.state = GameState.PAUSED;
                    } else if (this.state === GameState.PAUSED) {
                        this.state = GameState.PLAYING;
                        this.lastDrop = 0;
                    }
                },

                reset() {
                    this.start();
                }
            };
        }

        // ===== 渲染层 =====
        const canvas = document.getElementById('tetris-canvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-canvas');
        const nextCtx = nextCanvas.getContext('2d');
        const holdCanvas = document.getElementById('hold-canvas');
        const BLOCK_SIZE = 30;
        canvas.width = COLS * BLOCK_SIZE;
        canvas.height = ROWS * BLOCK_SIZE;

        const THEME = {
            boardBg: 'rgba(255, 248, 242, 0.7)',
            grid: 'rgba(255, 150, 110, 0.18)'
        };

        function roundRectPath(c, x, y, w, h, r) {
            if (c.roundRect) { c.beginPath(); c.roundRect(x, y, w, h, r); return; }
            c.beginPath();
            c.moveTo(x + r, y);
            c.arcTo(x + w, y, x + w, y + h, r);
            c.arcTo(x + w, y + h, x, y + h, r);
            c.arcTo(x, y + h, x, y, r);
            c.arcTo(x, y, x + w, y, r);
            c.closePath();
        }

        // 卡通糖果方块：圆角 + 顶部高光 + 底部暗影 + 玻璃光泽点
        function drawBlockAt(context, x, y, color, offsetX = 0, offsetY = 0, size = BLOCK_SIZE) {
            const px = offsetX + x * size;
            const py = offsetY + y * size;
            const pad = Math.max(1, size * 0.08);
            const bx = px + pad, by = py + pad, bw = size - pad * 2, bh = size - pad * 2;
            const r = bw * 0.22;

            context.save();
            context.shadowColor = 'rgba(120, 60, 30, 0.22)';
            context.shadowBlur = size * 0.12;
            context.shadowOffsetY = size * 0.06;
            roundRectPath(context, bx, by, bw, bh, r);
            context.fillStyle = color;
            context.fill();
            context.restore();

            context.save();
            roundRectPath(context, bx, by, bw, bh, r);
            context.clip();
            const grad = context.createLinearGradient(bx, by, bx, by + bh);
            grad.addColorStop(0, 'rgba(255,255,255,0.55)');
            grad.addColorStop(0.45, 'rgba(255,255,255,0.05)');
            grad.addColorStop(1, 'rgba(0,0,0,0.14)');
            context.fillStyle = grad;
            context.fillRect(bx, by, bw, bh);
            context.fillStyle = 'rgba(255,255,255,0.7)';
            context.beginPath();
            context.ellipse(bx + bw * 0.32, by + bh * 0.28, bw * 0.14, bh * 0.1, 0, 0, Math.PI * 2);
            context.fill();
            context.restore();
        }

        function drawBoard(board) {
            ctx.fillStyle = THEME.boardBg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = THEME.grid;
            ctx.lineWidth = 1;
            for (let x = 0; x <= COLS; x++) {
                ctx.beginPath();
                ctx.moveTo(x * BLOCK_SIZE + 0.5, 0);
                ctx.lineTo(x * BLOCK_SIZE + 0.5, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= ROWS; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * BLOCK_SIZE + 0.5);
                ctx.lineTo(canvas.width, y * BLOCK_SIZE + 0.5);
                ctx.stroke();
            }
            board.forEach((row, y) => {
                row.forEach((cell, x) => {
                    if (cell) drawBlockAt(ctx, x, y, cell.color);
                });
            });
        }

        function drawPiece(piece) {
            if (!piece) return;
            piece.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) drawBlockAt(ctx, piece.x + x, piece.y + y, piece.color);
                });
            });
        }

        function getGhostPosition(piece, board) {
            let ghostY = piece.y;
            while (!collides({ ...piece, y: ghostY + 1 }, board)) ghostY++;
            return { x: piece.x, y: ghostY };
        }

        function drawGhost(game) {
            if (!game.piece || game.state !== GameState.PLAYING) return;
            const ghost = getGhostPosition(game.piece, game.board);
            ctx.strokeStyle = 'rgba(255, 120, 80, 0.4)';
            ctx.setLineDash([4, 3]);
            ctx.lineWidth = 2;
            game.piece.matrix.forEach((row, y) => {
                row.forEach((val, x) => {
                    if (val) {
                        ctx.strokeRect(
                            (ghost.x + x) * BLOCK_SIZE + 3,
                            (ghost.y + y) * BLOCK_SIZE + 3,
                            BLOCK_SIZE - 6, BLOCK_SIZE - 6
                        );
                    }
                });
            });
            ctx.setLineDash([]);
        }

        function drawNextPiece(game) {
            nextCtx.fillStyle = 'rgba(255, 248, 242, 0.6)';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            const queue = game.nextQueue && game.nextQueue.length ? game.nextQueue : (game.nextPiece ? [game.nextPiece] : []);
            if (!queue.length) return;
            const slotH = nextCanvas.height / 3;
            queue.slice(0, 3).forEach((p, i) => {
                const size = i === 0 ? 26 : 21;
                const matrix = p.matrix;
                const offsetX = (nextCanvas.width - matrix[0].length * size) / 2;
                const offsetY = i * slotH + (slotH - matrix.length * size) / 2;
                if (i > 0) nextCtx.globalAlpha = 0.62;
                matrix.forEach((row, y) => {
                    row.forEach((val, x) => {
                        if (val) drawBlockAt(nextCtx, x, y, p.color, offsetX, offsetY, size);
                    });
                });
                nextCtx.globalAlpha = 1;
            });
            nextCtx.strokeStyle = 'rgba(255, 150, 110, 0.3)';
            nextCtx.lineWidth = 1;
            for (let i = 1; i < 3; i++) {
                nextCtx.beginPath();
                nextCtx.moveTo(10, i * slotH + 0.5);
                nextCtx.lineTo(nextCanvas.width - 10, i * slotH + 0.5);
                nextCtx.stroke();
            }
        }

        function drawHoldPiece(game) {
            const holdCtx = holdCanvas.getContext('2d');
            holdCtx.fillStyle = 'rgba(255, 248, 242, 0.6)';
            holdCtx.fillRect(0, 0, holdCanvas.width, holdCanvas.height);
            if (!game.holdType) return;
            const color = PIECE_COLORS[game.holdType];
            if (game.holdUsed) holdCtx.globalAlpha = 0.35;
            const ref = PIECES[game.holdType];
            const matrix = ref.matrix;
            const size = 26;
            const offsetX = (holdCanvas.width - matrix[0].length * size) / 2;
            const offsetY = (holdCanvas.height - matrix.length * size) / 2;
            matrix.forEach((row, y) => {
                row.forEach((val, x) => {
                    if (val) drawBlockAt(holdCtx, x, y, color, offsetX, offsetY, size);
                });
            });
            holdCtx.globalAlpha = 1;
        }

        function render(game) {
            drawBoard(game.board);
            if (game.piece && game.state !== GameState.READY) {
                drawGhost(game);
                drawPiece(game.piece);
            }
            drawNextPiece(game);
            drawHoldPiece(game);
        }

        // ===== 音效层 =====
        let audioContext = null;
        let soundEnabled = true;

        function getAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            return audioContext;
        }

        function playTone(frequency, duration, type = 'sine', volume = 0.1) {
            if (!soundEnabled) return;
            try {
                const ac = getAudioContext();
                const oscillator = ac.createOscillator();
                const gainNode = ac.createGain();
                oscillator.type = type;
                oscillator.frequency.setValueAtTime(frequency, ac.currentTime);
                gainNode.gain.setValueAtTime(volume, ac.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
                oscillator.connect(gainNode);
                gainNode.connect(ac.destination);
                oscillator.start();
                oscillator.stop(ac.currentTime + duration);
            } catch (e) { /* 音频不可用时静默 */ }
        }

        function playMoveSound() { playTone(220, 0.05, 'square', 0.04); }
        function playRotateSound() { playTone(330, 0.05, 'square', 0.04); }
        function playDropSound() { playTone(160, 0.08, 'sawtooth', 0.07); }
        function playClearSound(linesCleared) {
            const notes = [440, 554, 659, 880];
            notes.slice(0, Math.max(1, linesCleared)).forEach((note, index) => {
                setTimeout(() => playTone(note, 0.12, 'sine', 0.09), index * 80);
            });
        }
        function playGameOverSound() {
            const notes = [392, 330, 262, 196];
            notes.forEach((note, index) => {
                setTimeout(() => playTone(note, 0.2, 'sine', 0.09), index * 150);
            });
        }

        // ===== 最高分记录 =====
        const BEST_SCORE_KEY = 'tetris-best-score';
        function getBestScore() {
            try {
                const legacy = parseInt(localStorage.getItem(BEST_SCORE_KEY) || '0', 10) || 0;
                return Math.max(legacy, leaderboardTop());
            } catch (e) { return 0; }
        }
        function updateBestScore(score) {
            const best = getBestScore();
            if (score > best) {
                try { localStorage.setItem(BEST_SCORE_KEY, score.toString()); } catch (e) {}
                return true;
            }
            return false;
        }

        // ===== 排行榜（本地 Top 10） =====
        const LB_KEY = 'tetris-leaderboard';
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function loadLeaderboard() {
            try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; } catch (e) { return []; }
        }
        function saveLeaderboard(list) {
            try { localStorage.setItem(LB_KEY, JSON.stringify(list)); } catch (e) {}
        }
        function leaderboardTop() {
            const l = loadLeaderboard();
            return l.length ? l[0].score : 0;
        }
        function qualifiesScore(score) {
            if (score <= 0) return false;
            const l = loadLeaderboard();
            return l.length < 10 || score > l[l.length - 1].score;
        }
        function addLeaderboardEntry(name, score, lines, level) {
            const l = loadLeaderboard();
            l.push({ name: (name || '玩家').slice(0, 10), score, lines, level, date: new Date().toISOString().slice(0, 10) });
            l.sort((a, b) => b.score - a.score);
            const top = l.slice(0, 10);
            saveLeaderboard(top);
            return top;
        }
        function renderLeaderboard() {
            const list = loadLeaderboard();
            const ul = document.getElementById('lb-list');
            const empty = document.getElementById('lb-empty');
            ul.innerHTML = '';
            if (!list.length) { empty.classList.remove('hidden'); return; }
            empty.classList.add('hidden');
            list.forEach((e, i) => {
                const li = document.createElement('li');
                li.innerHTML = '<span class="rank">' + (i + 1) + '</span>' +
                    '<span class="nm">' + escapeHtml(e.name) + '</span>' +
                    '<span class="sc">' + String(e.score).padStart(5, '0') + '</span>' +
                    '<span class="dt">' + e.date + '</span>';
                ul.appendChild(li);
            });
        }
        function showGameOverModal() {
            document.getElementById('go-score').textContent = game.score;
            document.getElementById('go-lines').textContent = game.lines;
            document.getElementById('go-level').textContent = game.level;
            const isNew = qualifiesScore(game.score);
            document.getElementById('go-newrecord').classList.toggle('hidden', !isNew);
            document.getElementById('go-name').style.display = isNew ? 'block' : 'none';
            document.getElementById('go-save-btn').style.display = isNew ? 'block' : 'none';
            document.getElementById('gameover-modal').classList.remove('hidden');
        }
        function closeModals() {
            document.getElementById('gameover-modal').classList.add('hidden');
            document.getElementById('leaderboard-modal').classList.add('hidden');
        }

        // ===== 消行特效层 =====
        const fx = { particles: [], texts: [], rowFlash: null };
        function spawnClearFx(rows, linesCleared, combo) {
            rows.forEach(y => {
                for (let x = 0; x < COLS; x++) {
                    for (let i = 0; i < 3; i++) {
                        fx.particles.push({
                            x: (x + 0.5) * BLOCK_SIZE,
                            y: (y + 0.5) * BLOCK_SIZE,
                            vx: (Math.random() - 0.5) * 160,
                            vy: (Math.random() - 0.9) * 140,
                            life: 0.5 + Math.random() * 0.35,
                            age: 0,
                            size: 1.5 + Math.random() * 2.5,
                            color: Math.random() < 0.6 ? '#ffd27a' : '#ff6b4a'
                        });
                    }
                }
            });
            fx.rowFlash = { rows: rows.slice(), age: 0, duration: 0.28 };
            if (combo > 1) {
                const bonus = (combo - 1) * 50 * game.level;
                fx.texts.push({
                    content: combo + ' COMBO  +' + bonus,
                    x: canvas.width / 2,
                    y: rows.length ? (rows[0] + 0.5) * BLOCK_SIZE : canvas.height / 2,
                    age: 0,
                    duration: 1.1
                });
            }
        }
        function updateFx(dt) {
            fx.particles.forEach(p => {
                p.age += dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 320 * dt;
            });
            fx.particles = fx.particles.filter(p => p.age < p.life);
            if (fx.rowFlash) {
                fx.rowFlash.age += dt;
                if (fx.rowFlash.age > fx.rowFlash.duration) fx.rowFlash = null;
            }
            fx.texts.forEach(t => { t.age += dt; t.y -= 26 * dt; });
            fx.texts = fx.texts.filter(t => t.age < t.duration);
        }
        function drawFx() {
            if (fx.rowFlash) {
                const alpha = 0.85 * (1 - fx.rowFlash.age / fx.rowFlash.duration);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#ffffff';
                fx.rowFlash.rows.forEach(y => {
                    ctx.fillRect(0, y * BLOCK_SIZE, canvas.width, BLOCK_SIZE);
                });
                ctx.restore();
            }
            ctx.save();
            fx.particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 6;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            });
            ctx.restore();
            ctx.save();
            ctx.textAlign = 'center';
            fx.texts.forEach(t => {
                ctx.globalAlpha = Math.max(0, 1 - t.age / t.duration);
                ctx.fillStyle = '#ff7a59';
                ctx.shadowColor = '#ffb38a';
                ctx.shadowBlur = 12;
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText(t.content, t.x, t.y);
            });
            ctx.restore();
            ctx.textAlign = 'start';
        }

        // ===== 游戏实例 =====
        const game = createGame({
            onMove: playMoveSound,
            onRotate: playRotateSound,
            onClear: (linesCleared, rows, combo) => {
                playClearSound(linesCleared);
                spawnClearFx(rows, linesCleared, combo);
            },
            onHold: () => { playTone(520, 0.06, 'triangle', 0.06); },
            onStart: () => {},
            onLevelUp: (level) => {
                playTone(660, 0.12, 'sine', 0.08);
                setTimeout(() => playTone(880, 0.14, 'sine', 0.08), 110);
                fx.texts.push({ content: 'LEVEL ' + level, x: canvas.width / 2, y: canvas.height / 2, age: 0, duration: 1.2 });
                fx.rowFlash = { rows: [], age: 0, duration: 0.2 };
            },
            onGameOver: () => {
                playGameOverSound();
                updateBestScore(game.score);
                showGameOverModal();
            }
        });

        // ===== 输入层：键盘 =====
        function handleKeyDown(event) {
            switch (event.key) {
                case 'ArrowLeft': event.preventDefault(); game.move(-1, 0); break;
                case 'ArrowRight': event.preventDefault(); game.move(1, 0); break;
                case 'ArrowDown': event.preventDefault(); if (game.move(0, 1)) game.score += 1; break;
                case 'ArrowUp':
                case 'x': case 'X': game.rotate('clockwise'); break;
                case 'z': case 'Z': game.rotate('counterclockwise'); break;
                case ' ': event.preventDefault(); if (game.hardDrop() > 0) playDropSound(); break;
                case 'c': case 'C': case 'Shift': game.hold(); break;
                case 'p': case 'P': case 'Escape': game.pause(); break;
                case 'r': case 'R': game.reset(); break;
            }
        }
        document.addEventListener('keydown', handleKeyDown);

        // ===== 居中遮罩 + 点击画面切换开始/暂停 =====
        function updateOverlay() {
            const ov = document.getElementById('board-overlay');
            if (game.state === GameState.PLAYING) { ov.classList.add('hidden'); return; }
            ov.classList.remove('hidden');
            const title = document.getElementById('overlay-title');
            const btn = document.getElementById('overlay-btn');
            const hint = document.getElementById('overlay-hint');
            if (game.state === GameState.GAME_OVER) {
                // 结算弹窗开着时由弹窗负责；弹窗关闭后这里提供“再来一局”
                if (!document.getElementById('gameover-modal').classList.contains('hidden')) {
                    ov.classList.add('hidden');
                    return;
                }
                title.textContent = '游戏结束';
                btn.textContent = '▶ 再来一局';
                hint.textContent = '点击画面或按钮再来一局';
                return;
            }
            if (game.state === GameState.READY) {
                title.textContent = '俄罗斯方块';
                btn.textContent = '▶ 开始';
                hint.textContent = '点击画面或按钮开始';
            } else if (game.state === GameState.PAUSED) {
                title.textContent = '已暂停';
                btn.textContent = '继续';
                hint.textContent = '点击画面或按钮继续';
            }
        }
        function togglePlay() {
            if (game.state === GameState.READY) { closeModals(); game.start(); }
            else if (game.state === GameState.PLAYING) { game.pause(); }
            else if (game.state === GameState.PAUSED) { game.pause(); }
            else if (game.state === GameState.GAME_OVER) { closeModals(); game.reset(); }
        }
        document.getElementById('board-panel').addEventListener('click', togglePlay);

        // 结算 / 排行榜弹窗按钮
        document.getElementById('go-restart-btn').addEventListener('click', () => { closeModals(); game.reset(); });
        document.getElementById('go-save-btn').addEventListener('click', () => {
            addLeaderboardEntry(document.getElementById('go-name').value.trim() || '玩家', game.score, game.lines, game.level);
            closeModals();
            renderLeaderboard();
            updateHUD();
            game.reset();
        });
        document.getElementById('lb-close-btn').addEventListener('click', () => document.getElementById('leaderboard-modal').classList.add('hidden'));

        // ===== 主题（卡通调色板切换） =====
        const THEMES = {
            candy: {
                boardBg: 'rgba(255, 248, 242, 0.7)',
                grid: 'rgba(255, 150, 110, 0.18)',
                css: { '--bg-1': '#fff3e9', '--bg-2': '#ffe2cf', '--panel': '#ffffff', '--panel-line': '#ffb38a', '--text': '#5b4636', '--accent': '#ff7a59', '--accent-d': '#e85d3c', '--shadow': 'rgba(255,122,89,0.28)' }
            },
            mint: {
                boardBg: 'rgba(240, 252, 250, 0.7)',
                grid: 'rgba(60, 180, 160, 0.18)',
                css: { '--bg-1': '#eafaf6', '--bg-2': '#d3efe9', '--panel': '#ffffff', '--panel-line': '#8fd9c8', '--text': '#3a5b53', '--accent': '#19b89b', '--accent-d': '#0f8f78', '--shadow': 'rgba(25,184,155,0.28)' }
            },
            bubblegum: {
                boardBg: 'rgba(255, 246, 253, 0.7)',
                grid: 'rgba(255, 130, 200, 0.18)',
                css: { '--bg-1': '#fdeaf6', '--bg-2': '#f6d6ee', '--panel': '#ffffff', '--panel-line': '#f3a6d8', '--text': '#5b3a52', '--accent': '#ff5fa2', '--accent-d': '#e23f86', '--shadow': 'rgba(255,95,162,0.28)' }
            }
        };
        const THEME_KEY = 'tetris-theme';
        let currentTheme = 'candy';
        const THEME_ORDER = ['candy', 'mint', 'bubblegum'];

        function applyTheme(themeName) {
            const theme = THEMES[themeName];
            if (!theme) return;
            currentTheme = themeName;
            THEME.boardBg = theme.boardBg;
            THEME.grid = theme.grid;
            Object.entries(theme.css).forEach(([k, v]) => {
                document.documentElement.style.setProperty(k, v);
            });
            try { localStorage.setItem(THEME_KEY, themeName); } catch (e) {}
        }
        function toggleTheme() {
            const idx = THEME_ORDER.indexOf(currentTheme);
            applyTheme(THEME_ORDER[(idx + 1) % THEME_ORDER.length]);
        }

        // ===== HUD 更新 =====
        function padScore(n) { return String(n).padStart(5, '0'); }
        function updateHUD() {
            document.getElementById('score').textContent = padScore(game.score);
            document.getElementById('lines').textContent = game.lines;
            document.getElementById('level').textContent = game.level;
            document.getElementById('best').textContent = padScore(Math.max(getBestScore(), game.score));
        }

        // ===== 设置弹窗（齿轮菜单） =====
        function openSettings() { document.getElementById('settings-popup').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settings-popup').classList.add('hidden'); }
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const b = document.querySelector('#settings-popup button[data-act="sound"]');
            b.textContent = soundEnabled ? '音效 ♪' : '静音 🔇';
            b.classList.toggle('off', !soundEnabled);
        }
        document.getElementById('gear-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('settings-popup').classList.toggle('hidden');
        });
        document.getElementById('settings-popup').addEventListener('click', (e) => {
            if (e.target.id === 'settings-popup') closeSettings();
        });
        document.querySelectorAll('#settings-popup .settings-card button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const act = btn.dataset.act;
                if (act === 'hold') game.hold();
                else if (act === 'restart') { closeModals(); game.reset(); }
                else if (act === 'theme') toggleTheme();
                else if (act === 'sound') toggleSound();
                else if (act === 'leaderboard') { renderLeaderboard(); document.getElementById('leaderboard-modal').classList.remove('hidden'); closeSettings(); }
                else if (act === 'close') closeSettings();
            });
        });

        // ===== 方向键 D-pad（2 行：↑旋转，← ↓软降 ⇓直落 →） =====
        function bindDpad() {
            const acts = {
                left: () => game.move(-1, 0),
                right: () => game.move(1, 0),
                down: () => { if (game.move(0, 1)) game.score += 1; },
                rotate: () => game.rotate('clockwise'),
                drop: () => { if (game.hardDrop() > 0) playDropSound(); }
            };
            document.querySelectorAll('#controls .dpad button').forEach(btn => {
                const act = btn.dataset.act;
                let repeat = null;
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    if (act === 'rotate' || act === 'drop') { acts[act](); return; }
                    acts[act]();
                    repeat = setInterval(acts[act], 130);
                });
                const stop = () => {
                    if (repeat) { clearInterval(repeat); repeat = null; }
                };
                ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
            });
        }
        bindDpad();

        // 棋盘手势：左右滑移动、下滑软降、快速下滑直落（轻点交由 click 切换暂停）
        function bindBoardGestures() {
            const SWIPE = 26;
            let lastX, lastY, sx, sy, st, moved;
            canvas.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                lastX = sx = t.clientX; lastY = sy = t.clientY; st = Date.now(); moved = false;
            }, { passive: true });
            canvas.addEventListener('touchmove', (e) => {
                const t = e.touches[0];
                const dx = t.clientX - lastX, dy = t.clientY - lastY;
                if (dx >= SWIPE) { game.move(1, 0); lastX = t.clientX; moved = true; }
                else if (dx <= -SWIPE) { game.move(-1, 0); lastX = t.clientX; moved = true; }
                if (dy >= SWIPE) { if (game.move(0, 1)) game.score += 1; lastY = t.clientY; moved = true; }
                if (moved) e.preventDefault();
            }, { passive: false });
            canvas.addEventListener('touchend', (e) => {
                const tdx = Math.abs(e.changedTouches[0].clientX - sx);
                const tdy = Math.abs(e.changedTouches[0].clientY - sy);
                if (moved) {
                    if (tdy > 70 && tdx < 50 && Date.now() - st < 260) {
                        if (game.hardDrop() > 0) playDropSound();
                    }
                    e.preventDefault();
                }
            }, { passive: false });
        }
        bindBoardGestures();

        // ===== 游戏循环 =====
        let lastFrameTime = 0;
        function gameLoop(timestamp) {
            const dt = lastFrameTime ? Math.min(0.1, (timestamp - lastFrameTime) / 1000) : 0;
            lastFrameTime = timestamp;
            game.tick(timestamp);
            render(game);
            drawFx();
            updateOverlay();
            updateHUD();
            updateFx(dt);
            requestAnimationFrame(gameLoop);
        }

        // ===== 初始化 =====
        try {
            const savedTheme = localStorage.getItem(THEME_KEY);
            if (savedTheme && THEMES[savedTheme]) currentTheme = savedTheme;
        } catch (e) {}
        applyTheme(currentTheme);
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
