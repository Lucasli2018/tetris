<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块</title>
    <style>
        :root {
            --bg: #0f0f23;
            --panel: #1a1a2e;
            --text: #e0e0e0;
            --accent: #00f0f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #app {
            display: flex;
            gap: 20px;
            padding: 20px;
        }
        .panel {
            background: var(--panel);
            border-radius: 8px;
            padding: 16px;
        }
        #side-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 180px;
        }
        .stat { font-size: 14px; }
        .stat .value { font-size: 22px; font-weight: bold; color: var(--accent); }
        canvas { display: block; border-radius: 4px; }
        button {
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover { filter: brightness(1.15); }
    </style>
</head>
<body>
    <div id="app">
        <div class="panel" id="board-panel">
            <canvas id="tetris-canvas"></canvas>
        </div>
        <div class="panel" id="side-panel">
            <div class="stat">分数<div class="value" id="score">0</div></div>
            <div class="stat">最高分<div class="value" id="best">0</div></div>
            <div class="stat">消行<div class="value" id="lines">0</div></div>
            <div class="stat">等级<div class="value" id="level">1</div></div>
            <div class="panel" id="next-panel">
                <canvas id="next-canvas" width="120" height="120"></canvas>
            </div>
            <button id="start-btn">开始</button>
            <button id="pause-btn">暂停</button>
            <button id="reset-btn">重开</button>
            <button id="theme-btn">主题</button>
        </div>
    </div>
    <script>
        'use strict';

        // ===== 常量 =====
        const COLS = 10;
        const ROWS = 20;
        const EMPTY = null;

        const GameState = {
            READY: 'ready',
            PLAYING: 'playing',
            PAUSED: 'paused',
            GAME_OVER: 'gameOver'
        };

        // ===== 方块定义 =====
        const PIECES = {
            I: { color: '#00f0f0', matrix: [[1,1,1,1]] },
            O: { color: '#f0f000', matrix: [[1,1],[1,1]] },
            T: { color: '#a000f0', matrix: [[0,1,0],[1,1,1]] },
            S: { color: '#00f000', matrix: [[0,1,1],[1,1,0]] },
            Z: { color: '#f00000', matrix: [[1,1,0],[0,1,1]] },
            J: { color: '#0000f0', matrix: [[1,0,0],[1,1,1]] },
            L: { color: '#f0a000', matrix: [[0,0,1],[1,1,1]] }
        };

        function createPiece(type) {
            const piece = PIECES[type];
            return {
                type,
                color: piece.color,
                matrix: piece.matrix.map(row => row.slice()),
                x: Math.floor(COLS / 2) - Math.floor(piece.matrix[0].length / 2),
                y: 0
            };
        }

        function rotateMatrix(matrix) {
            const N = matrix.length;
            const M = matrix[0].length;
            const rotated = Array.from({ length: M }, () => Array(N).fill(0));
            for (let y = 0; y < N; y++) {
                for (let x = 0; x < M; x++) {
                    rotated[x][N - 1 - y] = matrix[y][x];
                }
            }
            return rotated;
        }

        function rotatePiece(piece, direction) {
            let matrix = piece.matrix.map(row => row.slice());
            // 顺时针转 1 次，逆时针等价于顺时针转 3 次
            const times = direction === 'clockwise' ? 1 : 3;
            for (let i = 0; i < times; i++) {
                matrix = rotateMatrix(matrix);
            }
            return { ...piece, matrix };
        }

        // ===== 棋盘 =====
        function createBoard() {
            return Array.from({ length: ROWS }, () => Array(COLS).fill(EMPTY));
        }

        function isCellFilled(board, row, col) {
            return board[row] && board[row][col] !== EMPTY;
        }

        function isOutOfBounds(row, col) {
            return row < 0 || row >= ROWS || col < 0 || col >= COLS;
        }

        function collides(piece, board) {
            for (let y = 0; y < piece.matrix.length; y++) {
                for (let x = 0; x < piece.matrix[y].length; x++) {
                    if (piece.matrix[y][x]) {
                        const boardX = piece.x + x;
                        const boardY = piece.y + y;
                        if (isOutOfBounds(boardY, boardX) || (boardY >= 0 && isCellFilled(board, boardY, boardX))) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function clearLines(board) {
            let linesCleared = 0;
            for (let y = ROWS - 1; y >= 0; y--) {
                if (board[y].every(cell => cell !== EMPTY)) {
                    board.splice(y, 1);
                    board.unshift(Array(COLS).fill(EMPTY));
                    linesCleared++;
                    y++; // 重新检查当前行
                }
            }
            return linesCleared;
        }

        // ===== 游戏状态机 =====
        function createGame(hooks) {
            const h = hooks || {};
            return {
                state: GameState.READY,
                board: createBoard(),
                piece: null,
                nextPiece: null,
                score: 0,
                lines: 0,
                level: 1,
                dropInterval: 1000,
                lastDrop: 0,
                bag: [],

                start() {
                    this.state = GameState.PLAYING;
                    this.board = createBoard();
                    this.score = 0;
                    this.lines = 0;
                    this.level = 1;
                    this.dropInterval = 1000;
                    this.lastDrop = 0;
                    this.bag = [];
                    this.nextPiece = this.getNextPiece();
                    this.spawnPiece();
                    if (h.onStart) h.onStart();
                },

                spawnPiece() {
                    this.piece = this.nextPiece;
                    this.nextPiece = this.getNextPiece();
                    if (collides(this.piece, this.board)) {
                        this.state = GameState.GAME_OVER;
                        if (h.onGameOver) h.onGameOver();
                    }
                },

                getNextPiece() {
                    if (this.bag.length === 0) {
                        this.bag = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
                        // Fisher-Yates shuffle（7-bag 随机器）
                        for (let i = this.bag.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [this.bag[i], this.bag[j]] = [this.bag[j], this.bag[i]];
                        }
                    }
                    return createPiece(this.bag.pop());
                },

                move(dx, dy) {
                    if (this.state !== GameState.PLAYING) return false;
                    const moved = { ...this.piece, x: this.piece.x + dx, y: this.piece.y + dy };
                    if (!collides(moved, this.board)) {
                        this.piece = moved;
                        if (h.onMove) h.onMove();
                        return true;
                    }
                    return false;
                },

                rotate(direction) {
                    if (this.state !== GameState.PLAYING) return false;
                    const rotated = rotatePiece(this.piece, direction);
                    // 简化踢墙：原位不行则左右各试一格
                    const offsets = [0, -1, 1];
                    for (const off of offsets) {
                        const candidate = { ...rotated, x: rotated.x + off };
                        if (!collides(candidate, this.board)) {
                            this.piece = candidate;
                            if (h.onRotate) h.onRotate();
                            return true;
                        }
                    }
                    return false;
                },

                hardDrop() {
                    if (this.state !== GameState.PLAYING) return 0;
                    let distance = 0;
                    while (this.move(0, 1)) distance++;
                    this.lockPiece();
                    return distance;
                },

                lockPiece() {
                    this.piece.matrix.forEach((row, y) => {
                        row.forEach((value, x) => {
                            if (value) {
                                const by = this.piece.y + y;
                                const bx = this.piece.x + x;
                                if (by >= 0 && by < ROWS && bx >= 0 && bx < COLS) {
                                    this.board[by][bx] = {
                                        type: this.piece.type,
                                        color: this.piece.color
                                    };
                                }
                            }
                        });
                    });
                    const linesCleared = clearLines(this.board);
                    this.lines += linesCleared;
                    this.score += this.calculateScore(linesCleared);
                    this.updateDifficulty();
                    if (linesCleared > 0 && h.onClear) h.onClear(linesCleared);
                    this.spawnPiece();
                },

                calculateScore(linesCleared) {
                    const points = [0, 100, 300, 500, 800];
                    return points[linesCleared] * this.level;
                },

                updateDifficulty() {
                    this.level = Math.floor(this.lines / 10) + 1;
                    this.dropInterval = Math.max(100, 1000 - (this.level - 1) * 100);
                },

                tick(timestamp) {
                    if (this.state !== GameState.PLAYING) return;
                    if (!this.lastDrop) this.lastDrop = timestamp;
                    const elapsed = timestamp - this.lastDrop;
                    if (elapsed > this.dropInterval) {
                        if (!this.move(0, 1)) {
                            this.lockPiece();
                        }
                        this.lastDrop = timestamp;
                    }
                },

                pause() {
                    if (this.state === GameState.PLAYING) {
                        this.state = GameState.PAUSED;
                    } else if (this.state === GameState.PAUSED) {
                        this.state = GameState.PLAYING;
                        this.lastDrop = 0;
                    }
                },

                reset() {
                    this.start();
                }
            };
        }

        // ===== 渲染层 =====
        const canvas = document.getElementById('tetris-canvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-canvas');
        const nextCtx = nextCanvas.getContext('2d');
        const BLOCK_SIZE = 30;
        canvas.width = COLS * BLOCK_SIZE;
        canvas.height = ROWS * BLOCK_SIZE;

        const THEME = {
            background: '#1a1a2e',
            grid: 'rgba(255,255,255,0.05)'
        };

        function drawBlockAt(context, x, y, color, offsetX = 0, offsetY = 0, size = BLOCK_SIZE) {
            context.fillStyle = color;
            context.fillRect(offsetX + x * size + 1, offsetY + y * size + 1, size - 2, size - 2);
            context.strokeStyle = 'rgba(255,255,255,0.3)';
            context.strokeRect(offsetX + x * size + 1, offsetY + y * size + 1, size - 2, size - 2);
        }

        function drawBoard(board) {
            ctx.fillStyle = THEME.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 网格
            ctx.strokeStyle = THEME.grid;
            for (let x = 0; x <= COLS; x++) {
                ctx.beginPath();
                ctx.moveTo(x * BLOCK_SIZE, 0);
                ctx.lineTo(x * BLOCK_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= ROWS; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * BLOCK_SIZE);
                ctx.lineTo(canvas.width, y * BLOCK_SIZE);
                ctx.stroke();
            }

            // 已固定方块
            board.forEach((row, y) => {
                row.forEach((cell, x) => {
                    if (cell) drawBlockAt(ctx, x, y, cell.color);
                });
            });
        }

        function drawPiece(piece) {
            if (!piece) return;
            piece.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) drawBlockAt(ctx, piece.x + x, piece.y + y, piece.color);
                });
            });
        }

        function getGhostPosition(piece, board) {
            let ghostY = piece.y;
            while (!collides({ ...piece, y: ghostY + 1 }, board)) ghostY++;
            return { x: piece.x, y: ghostY };
        }

        function drawGhost(game) {
            if (!game.piece || game.state !== GameState.PLAYING) return;
            const ghost = getGhostPosition(game.piece, game.board);
            ctx.strokeStyle = 'rgba(255,255,255,0.25)';
            ctx.setLineDash([4, 3]);
            game.piece.matrix.forEach((row, y) => {
                row.forEach((val, x) => {
                    if (val) {
                        ctx.strokeRect(
                            (ghost.x + x) * BLOCK_SIZE + 2,
                            (ghost.y + y) * BLOCK_SIZE + 2,
                            BLOCK_SIZE - 4, BLOCK_SIZE - 4
                        );
                    }
                });
            });
            ctx.setLineDash([]);
        }

        function drawNextPiece(game) {
            nextCtx.fillStyle = THEME.background;
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            if (!game.nextPiece) return;
            const size = 24;
            const matrix = game.nextPiece.matrix;
            const offsetX = (nextCanvas.width - matrix[0].length * size) / 2;
            const offsetY = (nextCanvas.height - matrix.length * size) / 2;
            matrix.forEach((row, y) => {
                row.forEach((val, x) => {
                    if (val) drawBlockAt(nextCtx, x, y, game.nextPiece.color, offsetX, offsetY, size);
                });
            });
        }

        function render(game) {
            drawBoard(game.board);
            if (game.piece && game.state !== GameState.READY) {
                drawGhost(game);
                drawPiece(game.piece);
            }
            drawNextPiece(game);
        }

        // ===== 音效层 =====
        let audioContext = null;
        let soundEnabled = true;

        function getAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            return audioContext;
        }

        function playTone(frequency, duration, type = 'sine', volume = 0.1) {
            if (!soundEnabled) return;
            try {
                const ac = getAudioContext();
                const oscillator = ac.createOscillator();
                const gainNode = ac.createGain();

                oscillator.type = type;
                oscillator.frequency.setValueAtTime(frequency, ac.currentTime);
                gainNode.gain.setValueAtTime(volume, ac.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);

                oscillator.connect(gainNode);
                gainNode.connect(ac.destination);

                oscillator.start();
                oscillator.stop(ac.currentTime + duration);
            } catch (e) { /* 音频不可用时静默 */ }
        }

        function playMoveSound() {
            playTone(200, 0.05, 'square', 0.05);
        }

        function playRotateSound() {
            playTone(300, 0.05, 'square', 0.05);
        }

        function playDropSound() {
            playTone(150, 0.08, 'sawtooth', 0.08);
        }

        function playClearSound(linesCleared) {
            const notes = [440, 554, 659, 880];
            notes.slice(0, Math.max(1, linesCleared)).forEach((note, index) => {
                setTimeout(() => playTone(note, 0.12, 'sine', 0.1), index * 80);
            });
        }

        function playGameOverSound() {
            const notes = [392, 330, 262, 196];
            notes.forEach((note, index) => {
                setTimeout(() => playTone(note, 0.2, 'sine', 0.1), index * 150);
            });
        }

        // ===== 最高分记录 =====
        const BEST_SCORE_KEY = 'tetris-best-score';

        function getBestScore() {
            try {
                return parseInt(localStorage.getItem(BEST_SCORE_KEY) || '0', 10) || 0;
            } catch (e) {
                return 0;
            }
        }

        function updateBestScore(score) {
            const best = getBestScore();
            if (score > best) {
                try { localStorage.setItem(BEST_SCORE_KEY, score.toString()); } catch (e) {}
                return true;
            }
            return false;
        }

        // ===== 游戏实例（接入音效钩子）=====
        const game = createGame({
            onMove: playMoveSound,
            onRotate: playRotateSound,
            onClear: playClearSound,
            onGameOver: () => {
                playGameOverSound();
                updateBestScore(game.score);
            }
        });

        // ===== 输入层 =====
        function handleKeyDown(event) {
            switch (event.key) {
                case 'ArrowLeft':
                    event.preventDefault();
                    game.move(-1, 0);
                    break;
                case 'ArrowRight':
                    event.preventDefault();
                    game.move(1, 0);
                    break;
                case 'ArrowDown':
                    event.preventDefault();
                    if (game.move(0, 1)) game.score += 1;
                    break;
                case 'ArrowUp':
                case 'x':
                case 'X':
                    game.rotate('clockwise');
                    break;
                case 'z':
                case 'Z':
                    game.rotate('counterclockwise');
                    break;
                case ' ':
                    event.preventDefault();
                    if (game.hardDrop() > 0) playDropSound();
                    break;
                case 'p':
                case 'P':
                case 'Escape':
                    game.pause();
                    break;
                case 'r':
                case 'R':
                    game.reset();
                    break;
            }
        }

        document.addEventListener('keydown', handleKeyDown);

        document.getElementById('start-btn').addEventListener('click', () => game.start());
        document.getElementById('pause-btn').addEventListener('click', () => game.pause());
        document.getElementById('reset-btn').addEventListener('click', () => game.reset());
        // ===== 主题切换 =====
        const THEMES = {
            classic: {
                background: '#1a1a2e',
                grid: 'rgba(255,255,255,0.05)',
                css: { '--bg': '#0f0f23', '--accent': '#00f0f0' },
                blocks: {
                    I: '#00f0f0', O: '#f0f000', T: '#a000f0', S: '#00f000',
                    Z: '#f00000', J: '#0000f0', L: '#f0a000'
                }
            },
            neon: {
                background: '#0a0a1a',
                grid: 'rgba(0,255,255,0.1)',
                css: { '--bg': '#05050d', '--accent': '#00ffff' },
                blocks: {
                    I: '#00ffff', O: '#ffff00', T: '#ff00ff', S: '#00ff00',
                    Z: '#ff2222', J: '#4466ff', L: '#ff8800'
                }
            }
        };
        const THEME_KEY = 'tetris-theme';
        let currentTheme = 'classic';

        function applyTheme(themeName) {
            const theme = THEMES[themeName];
            if (!theme) return;
            currentTheme = themeName;
            THEME.background = theme.background;
            THEME.grid = theme.grid;
            Object.entries(theme.css).forEach(([k, v]) => {
                document.documentElement.style.setProperty(k, v);
            });
            // 更新已固定方块与活动方块的颜色
            game.board.forEach(row => row.forEach(cell => {
                if (cell) cell.color = theme.blocks[cell.type];
            }));
            if (game.piece) game.piece.color = theme.blocks[game.piece.type];
            if (game.nextPiece) game.nextPiece.color = theme.blocks[game.nextPiece.type];
            try { localStorage.setItem(THEME_KEY, themeName); } catch (e) {}
        }

        document.getElementById('theme-btn').addEventListener('click', () => {
            applyTheme(currentTheme === 'classic' ? 'neon' : 'classic');
        });

        // ===== HUD 更新 =====
        function updateHUD() {
            document.getElementById('score').textContent = game.score;
            document.getElementById('lines').textContent = game.lines;
            document.getElementById('level').textContent = game.level;
            document.getElementById('best').textContent = Math.max(getBestScore(), game.score);
        }

        // ===== 状态遮罩 =====
        function drawStateOverlay() {
            if (game.state === GameState.PLAYING) return;
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.font = 'bold 26px sans-serif';
            if (game.state === GameState.READY) {
                ctx.fillText('俄罗斯方块', canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = '15px sans-serif';
                ctx.fillText('点击「开始」按钮，或按 R 开始', canvas.width / 2, canvas.height / 2 + 15);
            } else if (game.state === GameState.PAUSED) {
                ctx.fillText('已暂停', canvas.width / 2, canvas.height / 2);
                ctx.font = '15px sans-serif';
                ctx.fillText('按 P 继续', canvas.width / 2, canvas.height / 2 + 28);
            } else if (game.state === GameState.GAME_OVER) {
                ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = '15px sans-serif';
                ctx.fillText('得分 ' + game.score + ' · 按 R 重新开始', canvas.width / 2, canvas.height / 2 + 15);
            }
            ctx.textAlign = 'start';
        }

        // ===== 游戏循环 =====
        function gameLoop(timestamp) {
            game.tick(timestamp);
            render(game);
            drawStateOverlay();
            updateHUD();
            requestAnimationFrame(gameLoop);
        }

        // ===== 初始化 =====
        try {
            const savedTheme = localStorage.getItem(THEME_KEY);
            if (savedTheme && THEMES[savedTheme]) currentTheme = savedTheme;
        } catch (e) {}
        applyTheme(currentTheme);
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
