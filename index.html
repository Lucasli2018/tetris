<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>俄罗斯方块</title>
    <style>
        :root {
            --bg-1: #04082a;
            --bg-2: #0a1445;
            --panel: #0e1c52;
            --panel-line: rgba(126, 156, 255, 0.6);
            --panel-line-dim: rgba(126, 156, 255, 0.28);
            --text: #dfe6ff;
            --accent: #00f0f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background:
                radial-gradient(ellipse at 20% 10%, rgba(40, 70, 200, 0.25), transparent 55%),
                radial-gradient(ellipse at 85% 90%, rgba(20, 40, 140, 0.3), transparent 55%),
                linear-gradient(160deg, var(--bg-1), var(--bg-2));
            color: var(--text);
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        /* 星空点缀 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,255,255,.5), transparent 100%),
                radial-gradient(1px 1px at 68% 14%, rgba(255,255,255,.4), transparent 100%),
                radial-gradient(1.5px 1.5px at 84% 38%, rgba(160,190,255,.5), transparent 100%),
                radial-gradient(1px 1px at 30% 74%, rgba(255,255,255,.35), transparent 100%),
                radial-gradient(1.5px 1.5px at 52% 48%, rgba(160,190,255,.4), transparent 100%),
                radial-gradient(1px 1px at 92% 78%, rgba(255,255,255,.45), transparent 100%),
                radial-gradient(1px 1px at 8% 56%, rgba(160,190,255,.35), transparent 100%);
            z-index: 0;
        }
        #app {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 24px;
            padding: 24px;
            align-items: stretch;
        }
        /* 像素风双层描边面板（原型图角框风格） */
        .panel {
            background: linear-gradient(180deg, rgba(20, 36, 100, 0.85), rgba(12, 22, 70, 0.9));
            border: 2px solid var(--panel-line);
            box-shadow:
                inset 0 0 0 3px var(--bg-2),
                inset 0 0 0 4px var(--panel-line-dim),
                0 0 22px rgba(40, 80, 220, 0.25);
            border-radius: 6px;
            padding: 16px;
        }
        /* 棋盘面板：canvas 居中且不被 flex 拉伸（避免非等比缩放导致网格与方块错位） */
        #board-panel { padding: 10px; display: flex; align-items: center; justify-content: center; }
        #tetris-canvas {
            height: min(600px, calc(100vh - 64px));
            width: auto;
        }
        #side-panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 190px;
        }
        .stat {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
            letter-spacing: 3px;
            color: #9fb4ee;
            text-transform: uppercase;
        }
        .stat .value {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 30px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--accent), 0 0 24px rgba(0, 240, 240, 0.5);
        }
        #next-panel, #hold-panel { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        #next-panel .label, #hold-panel .label {
            font-size: 12px;
            letter-spacing: 4px;
            color: #9fb4ee;
        }
        canvas { display: block; border-radius: 4px; }
        button {
            background: linear-gradient(180deg, rgba(30, 55, 160, 0.9), rgba(18, 32, 105, 0.95));
            color: var(--text);
            border: 2px solid var(--panel-line);
            box-shadow:
                inset 0 0 0 2px var(--bg-2),
                0 0 14px rgba(40, 80, 220, 0.3);
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 14px;
            letter-spacing: 4px;
            cursor: pointer;
            transition: filter 0.15s, transform 0.05s;
        }
        button:hover { filter: brightness(1.35); }
        button:active { transform: scale(0.97); }
        #primary-btn {
            background: linear-gradient(180deg, #00c8c8, #008a9a);
            color: #03222a;
            border-color: rgba(160, 255, 255, 0.75);
            font-weight: bold;
            text-shadow: none;
        }
        /* 触屏控制条（仅移动端显示） */
        #touch-controls {
            display: none;
        }
        /* ===== 手机端适配 ===== */
        @media (max-width: 720px) {
            body { align-items: flex-start; justify-content: flex-start; }
            #app {
                flex-direction: column;
                gap: 12px;
                padding: 12px;
                width: 100%;
                max-width: 460px;
                align-items: stretch;
            }
            /* 棋盘按可用宽度等比缩放（canvas 内在 300x600，比例 1:2）
               高度以「可用宽度推导」为主，再用 dvh 兜底限制不超过可视区
               —— 避免移动端 100vh 含地址栏导致棋盘过高、控制条被裁切错位 */
            #board-panel {
                width: 100%;
                padding: 8px;
                justify-content: center;
            }
            #tetris-canvas {
                height: min(calc((100vw - 56px) * 2), 62vh);
                width: auto;
                max-width: 94vw;
            }
            /* 支持动态视口单位的浏览器用 dvh，进一步贴合真实可视高度 */
            @supports (height: 100dvh) {
                #tetris-canvas {
                    height: min(calc((100vw - 56px) * 2), 62dvh);
                }
            }
            #side-panel {
                order: 3;
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                gap: 10px;
                padding: 10px;
            }
            .stat {
                flex: 1 1 40%;
                align-items: center;
                font-size: 11px;
                letter-spacing: 2px;
            }
            .stat .value { font-size: 20px; letter-spacing: 2px; }
            #next-panel, #hold-panel {
                flex: 0 0 auto;
                padding: 6px 10px;
            }
            #next-canvas { width: 68px; height: 146px; }
            #hold-canvas { width: 68px; height: 58px; }
            #side-panel button {
                flex: 1 1 22%;
                padding: 9px 4px;
                font-size: 13px;
                letter-spacing: 2px;
            }
            /* 触屏控制条 */
            #touch-controls {
                display: grid;
                order: 2;
                grid-template-columns: repeat(5, 1fr);
                gap: 8px;
                width: 100%;
                max-width: 460px;
                padding: 0 2px;
            }
            #touch-controls button {
                padding: 15px 0;
                font-size: 20px;
                letter-spacing: 0;
                border-radius: 8px;
                touch-action: manipulation;
                -webkit-user-select: none;
                user-select: none;
            }
            /* 文字类操作按钮：缩小字号，与图标区分 */
            #touch-controls button[data-act="hold"],
            #touch-controls button[data-act="pause"],
            #touch-controls button[data-act="restart"],
            #touch-controls button[data-act="theme"],
            #touch-controls button[data-act="sound"] {
                font-size: 14px;
                letter-spacing: 1px;
            }
            #touch-controls button.off {
                opacity: 0.45;
                filter: grayscale(0.6);
            }
        }

        /* ===== 开通版本外壳 / 标题栏 / 弹窗 ===== */
        #shell {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        #topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 760px;
            padding: 0 4px;
        }
        #wordmark {
            font-family: 'Consolas', 'Courier New', monospace;
            font-weight: 900;
            font-size: 28px;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 0 12px var(--accent), 0 0 26px rgba(0, 240, 240, 0.6);
        }
        #lb-open-btn {
            background: linear-gradient(180deg, rgba(30, 55, 160, 0.9), rgba(18, 32, 105, 0.95));
            color: var(--text);
            border: 2px solid var(--panel-line);
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 13px;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: inset 0 0 0 2px var(--bg-2), 0 0 14px rgba(40, 80, 220, 0.3);
        }
        #lb-open-btn:hover { filter: brightness(1.3); }

        /* 弹窗（结算 / 排行榜） */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(2, 6, 30, 0.78);
            backdrop-filter: blur(2px);
            padding: 16px;
        }
        .modal.hidden { display: none; }
        .modal-card {
            width: 100%;
            max-width: 360px;
            background: linear-gradient(180deg, rgba(20, 36, 100, 0.96), rgba(12, 22, 70, 0.98));
            border: 2px solid var(--panel-line);
            border-radius: 10px;
            padding: 22px;
            box-shadow: inset 0 0 0 3px var(--bg-2), inset 0 0 0 4px var(--panel-line-dim), 0 0 30px rgba(40, 80, 220, 0.4);
            text-align: center;
        }
        .modal-card h2 {
            font-size: 22px;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 12px var(--accent);
            margin-bottom: 14px;
        }
        .modal-card .row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 14px;
            color: #cdd9ff;
            border-bottom: 1px dashed rgba(126, 156, 255, 0.25);
        }
        .modal-card .row b {
            color: #fff;
            font-family: 'Consolas', monospace;
            letter-spacing: 2px;
        }
        .modal-card input {
            width: 100%;
            margin: 12px 0;
            padding: 10px;
            text-align: center;
            font-size: 16px;
            letter-spacing: 2px;
            background: rgba(8, 16, 60, 0.6);
            border: 2px solid var(--panel-line);
            border-radius: 6px;
            color: #fff;
            outline: none;
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
        .modal-actions button { flex: 1; padding: 11px 0; font-size: 14px; letter-spacing: 2px; }
        #lb-list { list-style: none; max-height: 320px; overflow-y: auto; margin: 6px 0 14px; text-align: left; }
        #lb-list li {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 6px;
            font-size: 13px;
            color: #cdd9ff;
            border-bottom: 1px dashed rgba(126, 156, 255, 0.2);
        }
        #lb-list li .rank { width: 24px; text-align: center; font-weight: bold; color: var(--accent); font-family: 'Consolas', monospace; }
        #lb-list li .nm { flex: 1; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #lb-list li .sc { font-family: 'Consolas', monospace; color: #fff; letter-spacing: 1px; }
        #lb-list li .dt { font-size: 10px; color: #7e9cff; }
        #lb-empty { color: #7e9cff; font-size: 13px; padding: 18px 0; }
        @media (max-width: 720px) {
            #topbar { max-width: 460px; }
            #wordmark { font-size: 22px; letter-spacing: 5px; }
            #shell { gap: 10px; }
        }
    </style>
</head>
<body>
    <div id="shell">
        <header id="topbar">
            <div id="wordmark">TETRIS</div>
            <button id="lb-open-btn">排行榜</button>
        </header>
        <div id="app">
        <div class="panel" id="board-panel">
            <canvas id="tetris-canvas"></canvas>
        </div>
        <div class="panel" id="side-panel">
            <div class="stat">SCORE<div class="value" id="score">00000</div></div>
            <div class="stat">BEST<div class="value" id="best">00000</div></div>
            <div class="stat">LINES<div class="value" id="lines">0</div></div>
            <div class="stat">LEVEL<div class="value" id="level">1</div></div>
            <div class="panel" id="next-panel">
                <span class="label">NEXT</span>
                <canvas id="next-canvas" width="140" height="300"></canvas>
            </div>
            <div class="panel" id="hold-panel">
                <span class="label">HOLD</span>
                <canvas id="hold-canvas" width="140" height="120"></canvas>
            </div>
            <button id="hold-btn">暂存 (C)</button>
            <button id="start-btn">开始</button>
            <button id="pause-btn">暂停</button>
            <button id="reset-btn">重开</button>
            <button id="theme-btn">主题</button>
        </div>
        <div id="touch-controls">
            <button data-act="left" aria-label="左移">◀</button>
            <button data-act="rotate" aria-label="旋转">⟳</button>
            <button data-act="right" aria-label="右移">▶</button>
            <button data-act="down" aria-label="加速">▼</button>
            <button data-act="drop" aria-label="直落">⤓</button>
            <button data-act="hold" aria-label="暂存">暂存</button>
            <button data-act="pause" aria-label="暂停/继续">暂停</button>
            <button data-act="restart" aria-label="重开">重开</button>
            <button data-act="theme" aria-label="主题">主题</button>
            <button data-act="sound" aria-label="音效开关">音效</button>
        </div>
        </div>
    </div>

    <!-- 排行榜弹窗 -->
    <div id="leaderboard-modal" class="modal hidden">
        <div class="modal-card">
            <h2>排行榜 · TOP 10</h2>
            <ul id="lb-list"></ul>
            <div id="lb-empty" class="hidden">还没有记录，快去刷新纪录吧！</div>
            <div class="modal-actions">
                <button id="lb-close-btn">关闭</button>
            </div>
        </div>
    </div>

    <!-- 结算弹窗 -->
    <div id="gameover-modal" class="modal hidden">
        <div class="modal-card">
            <h2>游戏结束</h2>
            <div class="row"><span>得分</span><b id="go-score">0</b></div>
            <div class="row"><span>消行</span><b id="go-lines">0</b></div>
            <div class="row"><span>等级</span><b id="go-level">1</b></div>
            <div id="go-newrecord" class="hidden" style="color:#ffd27a;font-size:13px;margin-top:10px;text-shadow:0 0 10px #ff8c3a;">🏆 新纪录！留下你的大名</div>
            <input id="go-name" maxlength="10" placeholder="输入名字" value="玩家">
            <div class="modal-actions">
                <button id="go-save-btn">保存成绩</button>
                <button id="go-restart-btn">再来一局</button>
            </div>
        </div>
    </div>

    <script>
        'use strict';

        // ===== 常量 =====
        const COLS = 10;
        const ROWS = 20;
        const EMPTY = null;

        const GameState = {
            READY: 'ready',
            PLAYING: 'playing',
            PAUSED: 'paused',
            GAME_OVER: 'gameOver'
        };

        // ===== 方块定义 =====
        const PIECES = {
            I: { color: '#00f0f0', matrix: [[1,1,1,1]] },
            O: { color: '#f0f000', matrix: [[1,1],[1,1]] },
            T: { color: '#a000f0', matrix: [[0,1,0],[1,1,1]] },
            S: { color: '#00f000', matrix: [[0,1,1],[1,1,0]] },
            Z: { color: '#f00000', matrix: [[1,1,0],[0,1,1]] },
            J: { color: '#0000f0', matrix: [[1,0,0],[1,1,1]] },
            L: { color: '#f0a000', matrix: [[0,0,1],[1,1,1]] }
        };

        function createPiece(type) {
            const piece = PIECES[type];
            return {
                type,
                color: piece.color,
                matrix: piece.matrix.map(row => row.slice()),
                x: Math.floor(COLS / 2) - Math.floor(piece.matrix[0].length / 2),
                y: 0
            };
        }

        function rotateMatrix(matrix) {
            const N = matrix.length;
            const M = matrix[0].length;
            const rotated = Array.from({ length: M }, () => Array(N).fill(0));
            for (let y = 0; y < N; y++) {
                for (let x = 0; x < M; x++) {
                    rotated[x][N - 1 - y] = matrix[y][x];
                }
            }
            return rotated;
        }

        function rotatePiece(piece, direction) {
            let matrix = piece.matrix.map(row => row.slice());
            // 顺时针转 1 次，逆时针等价于顺时针转 3 次
            const times = direction === 'clockwise' ? 1 : 3;
            for (let i = 0; i < times; i++) {
                matrix = rotateMatrix(matrix);
            }
            return { ...piece, matrix };
        }

        // ===== 棋盘 =====
        function createBoard() {
            return Array.from({ length: ROWS }, () => Array(COLS).fill(EMPTY));
        }

        function isCellFilled(board, row, col) {
            return board[row] && board[row][col] !== EMPTY;
        }

        function isOutOfBounds(row, col) {
            return row < 0 || row >= ROWS || col < 0 || col >= COLS;
        }

        function collides(piece, board) {
            for (let y = 0; y < piece.matrix.length; y++) {
                for (let x = 0; x < piece.matrix[y].length; x++) {
                    if (piece.matrix[y][x]) {
                        const boardX = piece.x + x;
                        const boardY = piece.y + y;
                        if (isOutOfBounds(boardY, boardX) || (boardY >= 0 && isCellFilled(board, boardY, boardX))) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function clearLines(board) {
            let linesCleared = 0;
            for (let y = ROWS - 1; y >= 0; y--) {
                if (board[y].every(cell => cell !== EMPTY)) {
                    board.splice(y, 1);
                    board.unshift(Array(COLS).fill(EMPTY));
                    linesCleared++;
                    y++; // 重新检查当前行
                }
            }
            return linesCleared;
        }

        // ===== 游戏状态机 =====
        function createGame(hooks) {
            const h = hooks || {};
            return {
                state: GameState.READY,
                board: createBoard(),
                piece: null,
                nextPiece: null,
                nextQueue: [],
                score: 0,
                lines: 0,
                level: 1,
                dropInterval: 1000,
                lastDrop: 0,
                bag: [],
                holdType: null,
                holdUsed: false,
                combo: 0,

                start() {
                    this.state = GameState.PLAYING;
                    this.board = createBoard();
                    this.score = 0;
                    this.lines = 0;
                    this.level = 1;
                    this.dropInterval = 1000;
                    this.lastDrop = 0;
                    this.bag = [];
                    this.holdType = null;
                    this.holdUsed = false;
                    this.combo = 0;
                    this.nextQueue = [];
                    this.ensureQueue();
                    this.nextPiece = this.nextQueue[0];
                    this.spawnPiece();
                    if (h.onStart) h.onStart();
                },

                ensureQueue() {
                    while (this.nextQueue.length < 4) this.nextQueue.push(this.getNextPiece());
                },

                spawnPiece() {
                    this.piece = this.nextQueue.shift();
                    this.ensureQueue();
                    this.nextPiece = this.nextQueue[0];
                    this.holdUsed = false;
                    if (collides(this.piece, this.board)) {
                        this.state = GameState.GAME_OVER;
                        if (h.onGameOver) h.onGameOver();
                    }
                },

                hold() {
                    if (this.state !== GameState.PLAYING || this.holdUsed) return false;
                    const currentType = this.piece.type;
                    if (this.holdType) {
                        // 交换：暂存区与当前方块互换
                        const swapType = this.holdType;
                        this.holdType = currentType;
                        this.piece = createPiece(swapType);
                    } else {
                        // 首次暂存：从预览队列取下一块
                        this.holdType = currentType;
                        this.piece = this.nextQueue.shift();
                        this.ensureQueue();
                        this.nextPiece = this.nextQueue[0];
                    }
                    this.holdUsed = true;
                    if (h.onHold) h.onHold();
                    return true;
                },

                getNextPiece() {
                    if (this.bag.length === 0) {
                        this.bag = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
                        // Fisher-Yates shuffle（7-bag 随机器）
                        for (let i = this.bag.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [this.bag[i], this.bag[j]] = [this.bag[j], this.bag[i]];
                        }
                    }
                    return createPiece(this.bag.pop());
                },

                move(dx, dy) {
                    if (this.state !== GameState.PLAYING) return false;
                    const moved = { ...this.piece, x: this.piece.x + dx, y: this.piece.y + dy };
                    if (!collides(moved, this.board)) {
                        this.piece = moved;
                        if (h.onMove) h.onMove();
                        return true;
                    }
                    return false;
                },

                rotate(direction) {
                    if (this.state !== GameState.PLAYING) return false;
                    const rotated = rotatePiece(this.piece, direction);
                    // 简化踢墙：原位不行则左右各试一格
                    const offsets = [0, -1, 1];
                    for (const off of offsets) {
                        const candidate = { ...rotated, x: rotated.x + off };
                        if (!collides(candidate, this.board)) {
                            this.piece = candidate;
                            if (h.onRotate) h.onRotate();
                            return true;
                        }
                    }
                    return false;
                },

                hardDrop() {
                    if (this.state !== GameState.PLAYING) return 0;
                    let distance = 0;
                    while (this.move(0, 1)) distance++;
                    this.lockPiece();
                    return distance;
                },

                lockPiece() {
                    this.piece.matrix.forEach((row, y) => {
                        row.forEach((value, x) => {
                            if (value) {
                                const by = this.piece.y + y;
                                const bx = this.piece.x + x;
                                if (by >= 0 && by < ROWS && bx >= 0 && bx < COLS) {
                                    this.board[by][bx] = {
                                        type: this.piece.type,
                                        color: this.piece.color
                                    };
                                }
                            }
                        });
                    });
                    // 先记录满行位置（供消行特效使用），再执行消除
                    const rows = [];
                    this.board.forEach((row, y) => {
                        if (row.every(c => c !== EMPTY)) rows.push(y);
                    });
                    const linesCleared = clearLines(this.board);
                    this.lines += linesCleared;
                    // 连击：连续消行递增，中断清零；加成 = combo*50*等级
                    if (linesCleared > 0) {
                        this.combo++;
                        this.score += (this.combo - 1) * 50 * this.level;
                    } else {
                        this.combo = 0;
                    }
                    this.score += this.calculateScore(linesCleared);
                    this.updateDifficulty();
                    if (linesCleared > 0 && h.onClear) h.onClear(linesCleared, rows, this.combo);
                    this.spawnPiece();
                },

                calculateScore(linesCleared) {
                    const points = [0, 100, 300, 500, 800];
                    return points[linesCleared] * this.level;
                },

                updateDifficulty() {
                    const prevLevel = this.level;
                    this.level = Math.floor(this.lines / 10) + 1;
                    this.dropInterval = Math.max(100, 1000 - (this.level - 1) * 100);
                    if (this.level !== prevLevel && h.onLevelUp) h.onLevelUp(this.level);
                },

                tick(timestamp) {
                    if (this.state !== GameState.PLAYING) return;
                    if (!this.lastDrop) this.lastDrop = timestamp;
                    const elapsed = timestamp - this.lastDrop;
                    if (elapsed > this.dropInterval) {
                        if (!this.move(0, 1)) {
                            this.lockPiece();
                        }
                        this.lastDrop = timestamp;
                    }
                },

                pause() {
                    if (this.state === GameState.PLAYING) {
                        this.state = GameState.PAUSED;
                    } else if (this.state === GameState.PAUSED) {
                        this.state = GameState.PLAYING;
                        this.lastDrop = 0;
                    }
                },

                reset() {
                    this.start();
                }
            };
        }

        // ===== 渲染层 =====
        const canvas = document.getElementById('tetris-canvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-canvas');
        const nextCtx = nextCanvas.getContext('2d');
        const holdCanvas = document.getElementById('hold-canvas');
        const BLOCK_SIZE = 30;
        canvas.width = COLS * BLOCK_SIZE;
        canvas.height = ROWS * BLOCK_SIZE;

        const THEME = {
            boardBg: 'rgba(8, 16, 60, 0.55)',
            grid: 'rgba(140, 165, 255, 0.14)'
        };

        // 霓虹发光方块：填充色 + 外发光 + 内嵌白边（原型图风格）
        function drawBlockAt(context, x, y, color, offsetX = 0, offsetY = 0, size = BLOCK_SIZE) {
            const px = offsetX + x * size;
            const py = offsetY + y * size;
            const inset = Math.max(2, size * 0.12);

            context.save();
            // 外发光
            context.shadowColor = color;
            context.shadowBlur = size * 0.55;
            context.fillStyle = color;
            context.fillRect(px + inset, py + inset, size - inset * 2, size - inset * 2);
            context.restore();

            // 内嵌白边（发光管感）
            context.strokeStyle = 'rgba(255, 255, 255, 0.75)';
            context.lineWidth = Math.max(1.5, size * 0.07);
            context.strokeRect(px + inset + context.lineWidth / 2, py + inset + context.lineWidth / 2,
                size - inset * 2 - context.lineWidth, size - inset * 2 - context.lineWidth);
        }

        function drawBoard(board) {
            ctx.fillStyle = THEME.boardBg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 网格
            ctx.strokeStyle = THEME.grid;
            ctx.lineWidth = 1;
            for (let x = 0; x <= COLS; x++) {
                ctx.beginPath();
                ctx.moveTo(x * BLOCK_SIZE + 0.5, 0);
                ctx.lineTo(x * BLOCK_SIZE + 0.5, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= ROWS; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * BLOCK_SIZE + 0.5);
                ctx.lineTo(canvas.width, y * BLOCK_SIZE + 0.5);
                ctx.stroke();
            }

            // 已固定方块
            board.forEach((row, y) => {
                row.forEach((cell, x) => {
                    if (cell) drawBlockAt(ctx, x, y, cell.color);
                });
            });
        }

        function drawPiece(piece) {
            if (!piece) return;
            piece.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) drawBlockAt(ctx, piece.x + x, piece.y + y, piece.color);
                });
            });
        }

        function getGhostPosition(piece, board) {
            let ghostY = piece.y;
            while (!collides({ ...piece, y: ghostY + 1 }, board)) ghostY++;
            return { x: piece.x, y: ghostY };
        }

        function drawGhost(game) {
            if (!game.piece || game.state !== GameState.PLAYING) return;
            const ghost = getGhostPosition(game.piece, game.board);
            ctx.strokeStyle = 'rgba(255,255,255,0.25)';
            ctx.setLineDash([4, 3]);
            game.piece.matrix.forEach((row, y) => {
                row.forEach((val, x) => {
                    if (val) {
                        ctx.strokeRect(
                            (ghost.x + x) * BLOCK_SIZE + 2,
                            (ghost.y + y) * BLOCK_SIZE + 2,
                            BLOCK_SIZE - 4, BLOCK_SIZE - 4
                        );
                    }
                });
            });
            ctx.setLineDash([]);
        }

        // NEXT 预览队列：展示后续 3 块（首块高亮、尺寸略大）
        function drawNextPiece(game) {
            nextCtx.fillStyle = 'rgba(8, 16, 60, 0.35)';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            const queue = game.nextQueue && game.nextQueue.length ? game.nextQueue : (game.nextPiece ? [game.nextPiece] : []);
            if (!queue.length) return;
            const slotH = nextCanvas.height / 3;
            queue.slice(0, 3).forEach((p, i) => {
                const size = i === 0 ? 26 : 21;
                const matrix = p.matrix;
                const offsetX = (nextCanvas.width - matrix[0].length * size) / 2;
                const offsetY = i * slotH + (slotH - matrix.length * size) / 2;
                if (i > 0) nextCtx.globalAlpha = 0.62; // 后续块降低存在感
                matrix.forEach((row, y) => {
                    row.forEach((val, x) => {
                        if (val) drawBlockAt(nextCtx, x, y, p.color, offsetX, offsetY, size);
                    });
                });
                nextCtx.globalAlpha = 1;
            });
            // 分隔线
            nextCtx.strokeStyle = 'rgba(126, 156, 255, 0.22)';
            nextCtx.lineWidth = 1;
            for (let i = 1; i < 3; i++) {
                nextCtx.beginPath();
                nextCtx.moveTo(10, i * slotH + 0.5);
                nextCtx.lineTo(nextCanvas.width - 10, i * slotH + 0.5);
                nextCtx.stroke();
            }
        }

        function drawHoldPiece(game) {
            const holdCtx = holdCanvas.getContext('2d');
            holdCtx.fillStyle = 'rgba(8, 16, 60, 0.35)';
            holdCtx.fillRect(0, 0, holdCanvas.width, holdCanvas.height);
            if (!game.holdType) return;
            const color = (THEMES[currentTheme] && THEMES[currentTheme].blocks[game.holdType]) || PIECES[game.holdType].color;
            if (game.holdUsed) holdCtx.globalAlpha = 0.35; // 本回合已用暂存 → 半置灰
            const size = 26;
            // O 块 2x2，I 块 1x4，其余取实际矩阵
            const ref = PIECES[game.holdType];
            const matrix = ref.matrix;
            const offsetX = (holdCanvas.width - matrix[0].length * size) / 2;
            const offsetY = (holdCanvas.height - matrix.length * size) / 2;
            matrix.forEach((row, y) => {
                row.forEach((val, x) => {
                    if (val) drawBlockAt(holdCtx, x, y, color, offsetX, offsetY, size);
                });
            });
            holdCtx.globalAlpha = 1;
        }

        function render(game) {
            drawBoard(game.board);
            if (game.piece && game.state !== GameState.READY) {
                drawGhost(game);
                drawPiece(game.piece);
            }
            drawNextPiece(game);
            drawHoldPiece(game);
        }

        // ===== 音效层 =====
        let audioContext = null;
        let soundEnabled = true;

        function getAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            return audioContext;
        }

        function playTone(frequency, duration, type = 'sine', volume = 0.1) {
            if (!soundEnabled) return;
            try {
                const ac = getAudioContext();
                const oscillator = ac.createOscillator();
                const gainNode = ac.createGain();

                oscillator.type = type;
                oscillator.frequency.setValueAtTime(frequency, ac.currentTime);
                gainNode.gain.setValueAtTime(volume, ac.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);

                oscillator.connect(gainNode);
                gainNode.connect(ac.destination);

                oscillator.start();
                oscillator.stop(ac.currentTime + duration);
            } catch (e) { /* 音频不可用时静默 */ }
        }

        function playMoveSound() {
            playTone(200, 0.05, 'square', 0.05);
        }

        function playRotateSound() {
            playTone(300, 0.05, 'square', 0.05);
        }

        function playDropSound() {
            playTone(150, 0.08, 'sawtooth', 0.08);
        }

        function playClearSound(linesCleared) {
            const notes = [440, 554, 659, 880];
            notes.slice(0, Math.max(1, linesCleared)).forEach((note, index) => {
                setTimeout(() => playTone(note, 0.12, 'sine', 0.1), index * 80);
            });
        }

        function playGameOverSound() {
            const notes = [392, 330, 262, 196];
            notes.forEach((note, index) => {
                setTimeout(() => playTone(note, 0.2, 'sine', 0.1), index * 150);
            });
        }

        // ===== 最高分记录 =====
        const BEST_SCORE_KEY = 'tetris-best-score';

        function getBestScore() {
            try {
                const legacy = parseInt(localStorage.getItem(BEST_SCORE_KEY) || '0', 10) || 0;
                return Math.max(legacy, leaderboardTop());
            } catch (e) {
                return 0;
            }
        }

        function updateBestScore(score) {
            const best = getBestScore();
            if (score > best) {
                try { localStorage.setItem(BEST_SCORE_KEY, score.toString()); } catch (e) {}
                return true;
            }
            return false;
        }

        // ===== 排行榜（本地 Top 10） =====
        const LB_KEY = 'tetris-leaderboard';

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function loadLeaderboard() {
            try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; } catch (e) { return []; }
        }
        function saveLeaderboard(list) {
            try { localStorage.setItem(LB_KEY, JSON.stringify(list)); } catch (e) {}
        }
        function leaderboardTop() {
            const l = loadLeaderboard();
            return l.length ? l[0].score : 0;
        }
        function qualifiesScore(score) {
            if (score <= 0) return false;
            const l = loadLeaderboard();
            return l.length < 10 || score > l[l.length - 1].score;
        }
        function addLeaderboardEntry(name, score, lines, level) {
            const l = loadLeaderboard();
            l.push({ name: (name || '玩家').slice(0, 10), score, lines, level, date: new Date().toISOString().slice(0, 10) });
            l.sort((a, b) => b.score - a.score);
            const top = l.slice(0, 10);
            saveLeaderboard(top);
            return top;
        }
        function renderLeaderboard() {
            const list = loadLeaderboard();
            const ul = document.getElementById('lb-list');
            const empty = document.getElementById('lb-empty');
            ul.innerHTML = '';
            if (!list.length) { empty.classList.remove('hidden'); return; }
            empty.classList.add('hidden');
            list.forEach((e, i) => {
                const li = document.createElement('li');
                li.innerHTML = '<span class="rank">' + (i + 1) + '</span>' +
                    '<span class="nm">' + escapeHtml(e.name) + '</span>' +
                    '<span class="sc">' + String(e.score).padStart(5, '0') + '</span>' +
                    '<span class="dt">' + e.date + '</span>';
                ul.appendChild(li);
            });
        }
        function showGameOverModal() {
            document.getElementById('go-score').textContent = game.score;
            document.getElementById('go-lines').textContent = game.lines;
            document.getElementById('go-level').textContent = game.level;
            const isNew = qualifiesScore(game.score);
            document.getElementById('go-newrecord').classList.toggle('hidden', !isNew);
            document.getElementById('go-name').style.display = isNew ? 'block' : 'none';
            document.getElementById('go-save-btn').style.display = isNew ? 'block' : 'none';
            document.getElementById('gameover-modal').classList.remove('hidden');
        }
        function closeModals() {
            document.getElementById('gameover-modal').classList.add('hidden');
            document.getElementById('leaderboard-modal').classList.add('hidden');
        }

        // ===== 消行特效层（粒子火花 + 行闪光 + 连击浮字） =====
        const fx = { particles: [], texts: [], rowFlash: null };

        function spawnClearFx(rows, linesCleared, combo) {
            // 每个被消除的格子喷出火花粒子
            rows.forEach(y => {
                for (let x = 0; x < COLS; x++) {
                    for (let i = 0; i < 3; i++) {
                        fx.particles.push({
                            x: (x + 0.5) * BLOCK_SIZE,
                            y: (y + 0.5) * BLOCK_SIZE,
                            vx: (Math.random() - 0.5) * 160,
                            vy: (Math.random() - 0.9) * 140,
                            life: 0.5 + Math.random() * 0.35,
                            age: 0,
                            size: 1.5 + Math.random() * 2.5,
                            color: Math.random() < 0.6 ? '#ffd27a' : '#ff6b4a'
                        });
                    }
                }
            });
            fx.rowFlash = { rows: rows.slice(), age: 0, duration: 0.28 };
            if (combo > 1) {
                const bonus = (combo - 1) * 50 * game.level;
                fx.texts.push({
                    content: combo + ' COMBO  +' + bonus,
                    x: canvas.width / 2,
                    y: rows.length ? (rows[0] + 0.5) * BLOCK_SIZE : canvas.height / 2,
                    age: 0,
                    duration: 1.1
                });
            }
        }

        function updateFx(dt) {
            fx.particles.forEach(p => {
                p.age += dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 320 * dt; // 重力
            });
            fx.particles = fx.particles.filter(p => p.age < p.life);
            if (fx.rowFlash) {
                fx.rowFlash.age += dt;
                if (fx.rowFlash.age > fx.rowFlash.duration) fx.rowFlash = null;
            }
            fx.texts.forEach(t => { t.age += dt; t.y -= 26 * dt; });
            fx.texts = fx.texts.filter(t => t.age < t.duration);
        }

        function drawFx() {
            // 行闪光：白色高亮渐隐
            if (fx.rowFlash) {
                const alpha = 0.85 * (1 - fx.rowFlash.age / fx.rowFlash.duration);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#ffffff';
                fx.rowFlash.rows.forEach(y => {
                    ctx.fillRect(0, y * BLOCK_SIZE, canvas.width, BLOCK_SIZE);
                });
                ctx.restore();
            }
            // 火花粒子（发光小方块，呼应原型图）
            ctx.save();
            fx.particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 6;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            });
            ctx.restore();
            // 连击浮字
            ctx.save();
            ctx.textAlign = 'center';
            fx.texts.forEach(t => {
                ctx.globalAlpha = Math.max(0, 1 - t.age / t.duration);
                ctx.fillStyle = '#ffd27a';
                ctx.shadowColor = '#ff8c3a';
                ctx.shadowBlur = 12;
                ctx.font = 'bold 18px monospace';
                ctx.fillText(t.content, t.x, t.y);
            });
            ctx.restore();
            ctx.textAlign = 'start';
        }

        // ===== 游戏实例（接入音效钩子）=====
        const game = createGame({
            onMove: playMoveSound,
            onRotate: playRotateSound,
            onClear: (linesCleared, rows, combo) => {
                playClearSound(linesCleared);
                spawnClearFx(rows, linesCleared, combo);
            },
            onHold: () => {
                playTone(500, 0.06, 'triangle', 0.07);
                // 交换/取出可能生成新方块，同步当前主题色
                if (game.piece) game.piece.color = THEMES[currentTheme].blocks[game.piece.type];
            },
            onStart: () => {
                // 新一局开始：队列用当前主题色重建
                const theme = THEMES[currentTheme];
                if (game.nextQueue) game.nextQueue.forEach(p => { p.color = theme.blocks[p.type]; });
                if (game.nextPiece) game.nextPiece.color = theme.blocks[game.nextPiece.type];
            },
            onLevelUp: (level) => {
                playTone(660, 0.12, 'sine', 0.09);
                setTimeout(() => playTone(880, 0.14, 'sine', 0.09), 110);
                fx.texts.push({
                    content: 'LEVEL ' + level,
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    age: 0,
                    duration: 1.2
                });
                fx.rowFlash = { rows: [], age: 0, duration: 0.2 };
            },
            onGameOver: () => {
                playGameOverSound();
                updateBestScore(game.score);
                showGameOverModal();
            }
        });

        // ===== 输入层 =====
        function handleKeyDown(event) {
            switch (event.key) {
                case 'ArrowLeft':
                    event.preventDefault();
                    game.move(-1, 0);
                    break;
                case 'ArrowRight':
                    event.preventDefault();
                    game.move(1, 0);
                    break;
                case 'ArrowDown':
                    event.preventDefault();
                    if (game.move(0, 1)) game.score += 1;
                    break;
                case 'ArrowUp':
                case 'x':
                case 'X':
                    game.rotate('clockwise');
                    break;
                case 'z':
                case 'Z':
                    game.rotate('counterclockwise');
                    break;
                case ' ':
                    event.preventDefault();
                    if (game.hardDrop() > 0) playDropSound();
                    break;
                case 'c':
                case 'C':
                case 'Shift':
                    game.hold();
                    break;
                case 'p':
                case 'P':
                case 'Escape':
                    game.pause();
                    break;
                case 'r':
                case 'R':
                    game.reset();
                    break;
            }
        }

        document.addEventListener('keydown', handleKeyDown);

        document.getElementById('start-btn').addEventListener('click', () => { closeModals(); game.start(); });
        document.getElementById('pause-btn').addEventListener('click', () => game.pause());
        document.getElementById('reset-btn').addEventListener('click', () => game.reset());
        document.getElementById('hold-btn').addEventListener('click', () => game.hold());
        // 结算弹窗按钮
        document.getElementById('go-restart-btn').addEventListener('click', () => { closeModals(); game.reset(); });
        document.getElementById('go-save-btn').addEventListener('click', () => {
            addLeaderboardEntry(document.getElementById('go-name').value.trim() || '玩家', game.score, game.lines, game.level);
            closeModals();
            renderLeaderboard();
            updateHUD();
        });
        // 排行榜弹窗按钮
        document.getElementById('lb-open-btn').addEventListener('click', () => { renderLeaderboard(); document.getElementById('leaderboard-modal').classList.remove('hidden'); });
        document.getElementById('lb-close-btn').addEventListener('click', () => document.getElementById('leaderboard-modal').classList.add('hidden'));
        // ===== 主题切换 =====
        const THEMES = {
            classic: {
                boardBg: 'rgba(8, 16, 60, 0.55)',
                grid: 'rgba(140, 165, 255, 0.14)',
                css: { '--bg-1': '#04082a', '--bg-2': '#0a1445', '--panel': '#0e1c52', '--panel-line': 'rgba(126,156,255,0.6)', '--accent': '#00f0f0' },
                blocks: {
                    I: '#00f0f0', O: '#f0f000', T: '#a000f0', S: '#00f000',
                    Z: '#f00000', J: '#2b6bff', L: '#ff9500'
                }
            },
            neon: {
                boardBg: 'rgba(4, 8, 30, 0.6)',
                grid: 'rgba(0, 255, 255, 0.12)',
                css: { '--bg-1': '#02041a', '--bg-2': '#071033', '--panel': '#0a1438', '--panel-line': 'rgba(0,240,240,0.55)', '--accent': '#00ffff' },
                blocks: {
                    I: '#00ffff', O: '#ffff00', T: '#ff00ff', S: '#00ff00',
                    Z: '#ff2222', J: '#4466ff', L: '#ff8800'
                }
            }
        };
        const THEME_KEY = 'tetris-theme';
        let currentTheme = 'classic';

        function applyTheme(themeName) {
            const theme = THEMES[themeName];
            if (!theme) return;
            currentTheme = themeName;
            THEME.boardBg = theme.boardBg;
            THEME.grid = theme.grid;
            Object.entries(theme.css).forEach(([k, v]) => {
                document.documentElement.style.setProperty(k, v);
            });
            // 更新已固定方块与活动方块的颜色
            game.board.forEach(row => row.forEach(cell => {
                if (cell) cell.color = theme.blocks[cell.type];
            }));
            if (game.piece) game.piece.color = theme.blocks[game.piece.type];
            if (game.nextPiece) game.nextPiece.color = theme.blocks[game.nextPiece.type];
            if (game.nextQueue) game.nextQueue.forEach(p => { p.color = theme.blocks[p.type]; });
            try { localStorage.setItem(THEME_KEY, themeName); } catch (e) {}
        }

        function toggleTheme() {
            applyTheme(currentTheme === 'classic' ? 'neon' : 'classic');
        }
        document.getElementById('theme-btn').addEventListener('click', toggleTheme);

        // ===== HUD 更新 =====
        function padScore(n) {
            return String(n).padStart(5, '0');
        }
        function updateHUD() {
            document.getElementById('score').textContent = padScore(game.score);
            document.getElementById('lines').textContent = game.lines;
            document.getElementById('level').textContent = game.level;
            document.getElementById('best').textContent = padScore(Math.max(getBestScore(), game.score));
        }

        // ===== 状态遮罩 =====
        function drawStateOverlay() {
            if (game.state === GameState.PLAYING) return;
            ctx.fillStyle = 'rgba(2, 6, 30, 0.72)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0, 240, 240, 0.8)';
            ctx.shadowBlur = 18;
            ctx.font = 'bold 26px sans-serif';
            if (game.state === GameState.READY) {
                ctx.fillText('俄罗斯方块', canvas.width / 2, canvas.height / 2 - 20);
                ctx.shadowBlur = 0;
                ctx.font = '15px sans-serif';
                ctx.fillStyle = '#bcd0ff';
                ctx.fillText('点击「开始」按钮，或按 R 开始', canvas.width / 2, canvas.height / 2 + 15);
            } else if (game.state === GameState.PAUSED) {
                ctx.fillText('已暂停', canvas.width / 2, canvas.height / 2);
                ctx.shadowBlur = 0;
                ctx.font = '15px sans-serif';
                ctx.fillStyle = '#bcd0ff';
                ctx.fillText('按 P 继续', canvas.width / 2, canvas.height / 2 + 28);
            } else if (game.state === GameState.GAME_OVER) {
                ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 20);
                ctx.shadowBlur = 0;
                ctx.font = '15px sans-serif';
                ctx.fillStyle = '#bcd0ff';
                ctx.fillText('得分 ' + game.score + ' · 按 R 重新开始', canvas.width / 2, canvas.height / 2 + 15);
            }
            ctx.textAlign = 'start';
        }

        // ===== 游戏循环 =====
        let lastFrameTime = 0;
        function gameLoop(timestamp) {
            const dt = lastFrameTime ? Math.min(0.1, (timestamp - lastFrameTime) / 1000) : 0;
            lastFrameTime = timestamp;
            game.tick(timestamp);
            render(game);
            drawFx();
            drawStateOverlay();
            updateHUD();
            updateFx(dt);
            requestAnimationFrame(gameLoop);
        }

        // ===== 触屏控制层（移动端） =====
        // 控制按钮：单击执行；左右/下支持长按连发
        function bindTouchControls() {
            const REPEAT_ACTS = { left: () => game.move(-1, 0), right: () => game.move(1, 0), down: () => { if (game.move(0, 1)) game.score += 1; } };
            const SINGLE_ACTS = {
                rotate: () => game.rotate('clockwise'),
                drop: () => { if (game.hardDrop() > 0) playDropSound(); },
                hold: () => game.hold(),
                pause: () => game.pause(),
                restart: () => game.reset(),
                theme: () => toggleTheme(),
                sound: () => {
                    soundEnabled = !soundEnabled;
                    const soundBtn = document.querySelector('#touch-controls button[data-act="sound"]');
                    soundBtn.textContent = soundEnabled ? '音效' : '静音';
                    soundBtn.classList.toggle('off', !soundEnabled);
                }
            };
            document.querySelectorAll('#touch-controls button').forEach(btn => {
                const act = btn.dataset.act;
                let repeatTimer = null;
                const stopRepeat = () => { if (repeatTimer) { clearInterval(repeatTimer); repeatTimer = null; } };
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    if (SINGLE_ACTS[act]) { SINGLE_ACTS[act](); return; }
                    if (REPEAT_ACTS[act]) {
                        REPEAT_ACTS[act]();
                        repeatTimer = setInterval(REPEAT_ACTS[act], 130);
                    }
                });
                ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
                    btn.addEventListener(ev, stopRepeat));
            });
        }
        bindTouchControls();

        // 棋盘手势：左右滑移动、下滑软降、点按旋转
        function bindBoardGestures() {
            const SWIPE_THRESHOLD = 28;
            let lastX = 0, lastY = 0, startX = 0, startY = 0, startTime = 0, moved = false;
            canvas.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                lastX = startX = t.clientX;
                lastY = startY = t.clientY;
                startTime = Date.now();
                moved = false;
                e.preventDefault();
            }, { passive: false });
            canvas.addEventListener('touchmove', (e) => {
                const t = e.touches[0];
                const dx = t.clientX - lastX;
                const dy = t.clientY - lastY;
                if (dx >= SWIPE_THRESHOLD) { game.move(1, 0); lastX = t.clientX; moved = true; }
                else if (dx <= -SWIPE_THRESHOLD) { game.move(-1, 0); lastX = t.clientX; moved = true; }
                if (dy >= SWIPE_THRESHOLD) { if (game.move(0, 1)) game.score += 1; lastY = t.clientY; moved = true; }
                e.preventDefault();
            }, { passive: false });
            canvas.addEventListener('touchend', (e) => {
                const totalDx = Math.abs(e.changedTouches[0].clientX - startX);
                const totalDy = Math.abs(e.changedTouches[0].clientY - startY);
                // 快速下滑（未大幅横移）触发硬降
                if (totalDy > 70 && totalDx < 50 && Date.now() - startTime < 260) {
                    if (game.hardDrop() > 0) playDropSound();
                } else if (!moved && totalDx < 10 && totalDy < 10 && Date.now() - startTime < 300) {
                    game.rotate('clockwise');
                }
                e.preventDefault();
            }, { passive: false });
        }
        bindBoardGestures();

        // ===== 初始化 =====
        try {
            const savedTheme = localStorage.getItem(THEME_KEY);
            if (savedTheme && THEMES[savedTheme]) currentTheme = savedTheme;
        } catch (e) {}
        applyTheme(currentTheme);
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
